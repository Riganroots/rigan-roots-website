name: Apply Experiences Nepal identity

on:
  push:
    branches:
      - design/experiences-nepal-identity
    paths:
      - '.github/workflows/apply-experiences-nepal-identity.yml'

permissions:
  contents: write

jobs:
  update-experiences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/experiences-nepal-identity

      - name: Apply and validate Experiences visuals
        run: python tools/apply_experiences_identity.py

      - name: Commit Experiences visual update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-experiences-nepal-identity.yml
          git rm tools/apply_experiences_identity.py
          git add experiences/index.html
          git commit -m "Design Experiences selector with Nepal identity"
          git push origin HEAD:design/experiences-nepal-identity
