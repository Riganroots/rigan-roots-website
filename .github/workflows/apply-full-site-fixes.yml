name: Apply full-site fixes

on:
  push:
    branches:
      - fix/full-site-audit-sep17
    paths:
      - '.github/workflows/apply-full-site-fixes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-site-audit-sep17

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_required(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'{path}: expected pattern not found: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'{path}: no changes applied')
              p.write_text(text, encoding='utf-8')

          # 1) Remove extra leading slashes from dynamic URLs.
          replace_required('experiences/detail/index.html', [
              ('src="/${', 'src="${'),
              ("src='/${", "src='${"),
              ("url('/${", "url('${"),
          ])

          replace_required('plan/index.html', [
              ("url('/${", "url('${"),
          ])

          replace_required('regions/index.html', [
              ('href="/${', 'href="${'),
          ])

          # 2) Replace missing partner-logo file references with clean text badges.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          partner_old = '''  <div class="partner-logos">\n    <img src="/images/nepal-gov.png" onerror="this.style.display='none'" alt="Government of Nepal">\n    <img src="/images/ntb.png" onerror="this.style.display='none'" alt="Nepal Tourism Board">\n    <img src="/images/nma.png" onerror="this.style.display='none'" alt="Nepal Mountaineering Association">\n    <img src="/images/taan.png" onerror="this.style.display='none'" alt="TAAN Nepal">\n  </div>'''
          partner_new = '''  <div class="partner-logos" aria-label="Tourism organizations">\n    <span class="partner-name">Government of Nepal</span>\n    <span class="partner-name">Nepal Tourism Board</span>\n    <span class="partner-name">Nepal Mountaineering Association</span>\n    <span class="partner-name">TAAN Nepal</span>\n  </div>'''
          if partner_old not in text:
              raise SystemExit('index.html: partner logo block not found')
          text = text.replace(partner_old, partner_new, 1)

          css_old = '.partner-logos img:hover{transform:scale(1.08)}'
          css_new = '.partner-logos img:hover{transform:scale(1.08)}\n.partner-name{display:inline-flex;align-items:center;justify-content:center;min-height:64px;padding:14px 20px;border:1px solid rgba(23,77,47,.12);border-radius:18px;background:#fffaf2;color:var(--green);font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.06);text-align:center}'
          if css_old not in text:
              raise SystemExit('index.html: partner CSS anchor not found')
          text = text.replace(css_old, css_new, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Disable social placeholders rather than sending visitors to '#'.
          for filename in ['index.html', 'experiences/index.html', 'regions/index.html']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              if 'href="#"' in text:
                  text = text.replace('href="#"', 'aria-disabled="true" title="Social profile coming soon"')
                  p.write_text(text, encoding='utf-8')

          print('Applied dynamic URL, missing asset, and placeholder-link fixes.')
          PY

      - name: Validate fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = {
            'experiences/detail/index.html': ['src="/${', "src='/${", "url('/${"],
            'plan/index.html': ["url('/${"],
            'regions/index.html': ['href="/${'],
          }
          for filename, patterns in bad.items():
              text = Path(filename).read_text(encoding='utf-8')
              for pattern in patterns:
                  if pattern in text:
                      raise SystemExit(f'{filename}: malformed pattern remains: {pattern}')

          index = Path('index.html').read_text(encoding='utf-8')
          for missing in ['/images/nepal-gov.png','/images/ntb.png','/images/nma.png','/images/taan.png']:
              if missing in index:
                  raise SystemExit(f'index.html: missing asset reference remains: {missing}')

          for filename in ['index.html','experiences/index.html','regions/index.html']:
              if 'href="#"' in Path(filename).read_text(encoding='utf-8'):
                  raise SystemExit(f'{filename}: placeholder href remains')
          print('Targeted fixes validated.')
          PY

          for f in $(find . -name '*.js' -not -path './.git/*'); do
            node --check "$f"
          done

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html experiences/index.html experiences/detail/index.html plan/index.html regions/index.html
          git commit -m 'Fix remaining site routes, assets and placeholder links'
          git push
