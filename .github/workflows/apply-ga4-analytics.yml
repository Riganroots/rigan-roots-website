name: Apply GA4 analytics
on:
  push:
    branches:
      - feature/phase-5-ga4-analytics
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-5-ga4-analytics
      - name: Add analytics loader to all public pages
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          pages = [
              'index.html',
              'experience-v2.html',
              'experience-detail-v2.html',
              'regions.html',
              'about.html',
              'plan.html',
              'contact.html',
              'work-with-us.html',
          ]
          tag = '<script src="analytics.js" defer></script>'

          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if tag not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'Missing </head> in {name}')
                  text = text.replace('</head>', f'{tag}\n</head>', 1)
                  path.write_text(text, encoding='utf-8')

          for name in pages:
              text = Path(name).read_text(encoding='utf-8')
              if text.count(tag) != 1:
                  raise SystemExit(f'Analytics tag count invalid in {name}')

          analytics = Path('analytics.js').read_text(encoding='utf-8')
          required = [
              'G-0064L0NFLH',
              'package_view',
              'whatsapp_click',
              'plan_trip_click',
              'quote_request_click',
              'contact_enquiry_submit',
              'plan_enquiry_submit',
              'package_enquiry_submit',
          ]
          for item in required:
              if item not in analytics:
                  raise SystemExit(f'Missing analytics marker: {item}')
          PY
      - name: Commit analytics page integration and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-ga4-analytics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html experience-v2.html experience-detail-v2.html regions.html about.html plan.html contact.html work-with-us.html .github/workflows/apply-ga4-analytics.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Enable GA4 across website pages'
          git push origin HEAD:feature/phase-5-ga4-analytics
