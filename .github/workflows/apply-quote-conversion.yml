name: Apply quote conversion improvements
on:
  push:
    branches: [feature/phase-3-quote-conversion]
    paths: [.github/workflows/apply-quote-conversion.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-3-quote-conversion
      - name: Update Plan and detail conversion flow
        shell: python
        run: |
          from pathlib import Path

          plan = Path('plan.html')
          s = plan.read_text()
          original = s

          replacements = [
            (
              'Select a preferred region and experience, preview your journey, estimate the price, and send your request directly to our Nepal travel team.',
              'Select a preferred region and experience, preview your journey, request a tailored quote, and send your request directly to our Nepal travel team.'
            ),
            (
              '<div class="buttons"><button class="submit" type="submit"><i class="fas fa-paper-plane"></i> Send Tour Inquiry</button><button class="wa" type="button" id="waBtn"><i class="fab fa-whatsapp"></i> Send on WhatsApp</button></div><div class="note">The displayed price is an initial estimate only.</div>',
              '<div class="buttons"><button class="submit" type="submit"><i class="fas fa-paper-plane"></i> Request Tailored Quote</button><button class="wa" type="button" id="waBtn"><i class="fab fa-whatsapp"></i> Get Quote on WhatsApp</button></div><div class="note">Custom and detailed packages are quoted after we confirm your dates, group size, hotel level, transport, and inclusions.</div>'
            ),
            (
              '<div class="price"><strong>Estimated Total</strong><span id="estimatedPrice">Request Quote</span><small id="priceNote"></small></div>',
              '<div class="price"><strong id="priceHeading">Estimated Total</strong><span id="estimatedPrice">Request Quote</span><small id="priceNote"></small></div>'
            ),
            (
              '</footer>\n<script>\nconst IMG=',
              '</footer>\n<script src="experience-data-v2.js"></script>\n<script>\nconst IMG='
            ),
          ]

          for old, new in replacements:
            assert old in s, f'Missing expected plan fragment: {old[:90]}'
            s = s.replace(old, new, 1)

          old_helpers = "function text(sel){return sel.options[sel.selectedIndex]?.text||''}function getExp(){const k=experience.value||'custom-trip';return expData[k]||[text(experience),'A customizable Nepal experience.',IMG.pokhara,80,5,'Travellers seeking a personal journey','Custom','Selected Journey']}function getRegion(){return region.value?(regionData[region.value]||[text(region),'A custom Nepal route.',IMG.pokhara,'Custom Region']):null}"
          new_helpers = "function text(sel){return sel.options[sel.selectedIndex]?.text||''}function sharedExp(k){if(!window.experienceDataV2)return null;for(const category of Object.values(window.experienceDataV2)){const item=(category.items||[]).find(i=>i.id===k||i.slug===k);if(item)return item}return null}function getExp(){const k=experience.value||'custom-trip';if(expData[k])return expData[k];const shared=sharedExp(k);if(shared){const m=String(shared.duration||'').match(/\\d+/);return[shared.name||text(experience)||'Selected Nepal Experience',shared.overview||shared.description||shared.subtitle||'A customizable Nepal experience.',shared.image||IMG.pokhara,null,m?m[0]:'custom',Array.isArray(shared.bestFor)&&shared.bestFor.length?shared.bestFor[0]:'Travellers seeking a personal journey',shared.style||'Custom',shared.badge||'Selected Journey']}return[text(experience)||'Custom Nepal Journey','A customizable Nepal experience.',IMG.pokhara,null,'custom','Travellers seeking a personal journey','Custom','Selected Journey']}function supportsEstimate(){const k=experience.value||'custom-trip';return Object.prototype.hasOwnProperty.call(expData,k)&&k!=='custom-trip'}function getRegion(){return region.value?(regionData[region.value]||[text(region),'A custom Nepal route.',IMG.pokhara,'Custom Region']):null}"
          assert old_helpers in s, 'Plan getExp helper block changed unexpectedly'
          s = s.replace(old_helpers, new_helpers, 1)

          old_calc = "function calc(){const e=getExp();if(!duration.value||duration.value==='custom'||!group.value){$('estimatedPrice').textContent='Request Quote';$('priceNote').textContent='Select trip length and group size.';$('priceInput').value='Request Quote';return}const total=Math.round(e[3]*Number(duration.value)*Number(group.value)*Number(style.value));$('estimatedPrice').textContent='$'+total.toLocaleString();$('priceNote').textContent='Initial estimate only. Final quotation may vary.';$('priceInput').value='$'+total.toLocaleString()}"
          new_calc = "function calc(){const e=getExp();if(!supportsEstimate()){$('priceHeading').textContent='Tailored Quote';$('estimatedPrice').textContent='Request Quote';$('priceNote').textContent='We will confirm a detailed quote after your dates, group size, hotel level, transport, permits, and inclusions are checked.';$('priceInput').value='Request Quote';return}$('priceHeading').textContent='Estimated Total';if(!duration.value||duration.value==='custom'||!group.value){$('estimatedPrice').textContent='Request Quote';$('priceNote').textContent='Select trip length and group size for an initial estimate.';$('priceInput').value='Request Quote';return}const total=Math.round(e[3]*Number(duration.value)*Number(group.value)*Number(style.value));$('estimatedPrice').textContent='$'+total.toLocaleString();$('priceNote').textContent='Initial estimate only. Final quotation is confirmed after availability and inclusions are checked.';$('priceInput').value='$'+total.toLocaleString()}"
          assert old_calc in s, 'Plan calc function changed unexpectedly'
          s = s.replace(old_calc, new_calc, 1)

          assert 'Estimated Price: ${$(\'estimatedPrice\').textContent}' in s
          s = s.replace('Estimated Price: ${$(\'estimatedPrice\').textContent}', 'Price / Quote Status: ${$(\'estimatedPrice\').textContent}', 1)

          old_init = "duration.value=getExp()[4];const now=new Date();"
          new_init = "const initialDuration=String(getExp()[4]||'custom');duration.value=[...duration.options].some(o=>o.value===initialDuration)?initialDuration:'custom';const now=new Date();"
          assert old_init in s, 'Plan initial duration assignment changed unexpectedly'
          s = s.replace(old_init, new_init, 1)

          assert s != original
          plan.write_text(s)

          detail = Path('experience-detail-v2.html')
          d = detail.read_text()
          d0 = d

          detail_replacements = [
            ('<p class="price-label">Starting From</p>', '<p class="price-label" id="priceHeadingLabel">Starting From</p>'),
            ('<p class="price-label">Per Person / Estimated</p>', '<p class="price-label" id="priceSubLabel">Per Person / Estimated</p>'),
            ('Send Tour Inquiry\n          </button>', 'Request Detailed Quote\n          </button>'),
            ('Send Inquiry on WhatsApp\n        </button>', 'Get Quote on WhatsApp\n        </button>'),
          ]
          for old, new in detail_replacements:
            assert old in d, f'Missing expected detail fragment: {old[:70]}'
            d = d.replace(old, new, 1)

          old_price_render = '''      document.getElementById(\n        "price"\n      ).textContent =\n        selected.price || "Request Quote";'''
          new_price_render = '''      const hasDisplayedPrice = Boolean(\n        selected.price && String(selected.price).trim()\n      );\n\n      document.getElementById(\n        "price"\n      ).textContent =\n        hasDisplayedPrice ? selected.price : "Request Quote";\n\n      document.getElementById(\n        "priceHeadingLabel"\n      ).textContent = hasDisplayedPrice\n        ? "Starting From"\n        : "Custom Quote";\n\n      document.getElementById(\n        "priceSubLabel"\n      ).textContent = hasDisplayedPrice\n        ? "Per Person / Estimated"\n        : "Tailored to Your Dates & Group";'''
          assert old_price_render in d, 'Detail price render block changed unexpectedly'
          d = d.replace(old_price_render, new_price_render, 1)

          old_wa_gate = '''        function () {\n          if (!inquiryForm.checkValidity()) {\n            inquiryForm.reportValidity();\n            return;\n          }\n\n          const message =\n            buildWhatsAppMessage();'''
          new_wa_gate = '''        function () {\n          const message =\n            buildWhatsAppMessage();'''
          assert old_wa_gate in d, 'Detail WhatsApp validation block changed unexpectedly'
          d = d.replace(old_wa_gate, new_wa_gate, 1)

          assert d != d0
          detail.write_text(d)

          # Syntax smoke check for the plan inline script contents that we changed.
          assert 'function supportsEstimate()' in s
          assert 'sharedExp(k)' in s
          assert 'Tailored Quote' in s
          assert 'priceHeadingLabel' in d and 'priceSubLabel' in d
          assert 'Get Quote on WhatsApp' in d
      - name: Commit website changes and remove temporary workflow
        run: |
          rm -f .github/workflows/apply-quote-conversion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plan.html experience-detail-v2.html .github/workflows/apply-quote-conversion.yml
          git commit -m 'Improve quote presentation and WhatsApp conversion'
          git push origin HEAD:feature/phase-3-quote-conversion
