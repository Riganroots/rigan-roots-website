name: Apply Regions Nepal identity

on:
  push:
    branches:
      - design/regions-nepal-identity
    paths:
      - '.github/workflows/apply-regions-nepal-identity.yml'

permissions:
  contents: write

jobs:
  update-regions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/regions-nepal-identity

      - name: Apply Nepal-specific Regions visuals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('regions/index.html')
          text = path.read_text(encoding='utf-8')

          old_bg = '''    .region-mandala {\n      position: relative;\n      width: min(760px, 100%);\n      height: 600px;\n      margin: 0 auto;\n      overflow: hidden;\n      border: 1px solid rgba(23, 77, 47, 0.08);\n      border-radius: 44px;\n      background:\n        radial-gradient(\n          circle at center,\n          rgba(159, 186, 107, 0.18),\n          transparent 27%\n        ),\n        radial-gradient(\n          circle at 18% 15%,\n          rgba(230, 195, 106, 0.18),\n          transparent 25%\n        ),\n        radial-gradient(\n          circle at 82% 84%,\n          rgba(154, 106, 66, 0.14),\n          transparent 28%\n        ),\n        rgba(255, 255, 255, 0.84);\n      box-shadow: var(--shadow);\n      backdrop-filter: blur(18px);\n    }'''

          new_bg = '''    .region-mandala {\n      --region-bg: url("https://i.postimg.cc/JzZmBkdB/cultural-journey.jpg");\n      position: relative;\n      width: min(760px, 100%);\n      height: 600px;\n      margin: 0 auto;\n      overflow: hidden;\n      border: 1px solid rgba(23, 77, 47, 0.08);\n      border-radius: 44px;\n      background-image:\n        linear-gradient(\n          135deg,\n          rgba(247, 240, 228, 0.78),\n          rgba(247, 240, 228, 0.9)\n        ),\n        var(--region-bg);\n      background-position: center;\n      background-size: cover;\n      background-repeat: no-repeat;\n      box-shadow: var(--shadow);\n      backdrop-filter: blur(18px);\n      transition: background-image 0.45s ease;\n    }\n\n    .prayer-flags {\n      position: absolute;\n      top: 11px;\n      left: 2%;\n      z-index: 3;\n      width: 96%;\n      height: 68px;\n      display: flex;\n      align-items: flex-start;\n      justify-content: space-between;\n      padding: 0 22px;\n      pointer-events: none;\n      opacity: 0.74;\n    }\n\n    .prayer-flags::before {\n      content: "";\n      position: absolute;\n      top: 7px;\n      left: 0;\n      width: 100%;\n      height: 42px;\n      border-top: 2px solid rgba(78, 64, 45, 0.35);\n      border-radius: 50%;\n      transform: translateY(4px);\n    }\n\n    .prayer-flags span {\n      position: relative;\n      z-index: 1;\n      width: 23px;\n      height: 32px;\n      border-radius: 2px 2px 4px 4px;\n      box-shadow: 0 4px 12px rgba(19, 32, 24, 0.09);\n      clip-path: polygon(0 0, 100% 0, 100% 86%, 50% 100%, 0 86%);\n    }\n\n    .prayer-flags span:nth-child(1),\n    .prayer-flags span:nth-child(11) { background: #3157a4; }\n    .prayer-flags span:nth-child(2),\n    .prayer-flags span:nth-child(7),\n    .prayer-flags span:nth-child(12) { background: #f6f0dd; }\n    .prayer-flags span:nth-child(3),\n    .prayer-flags span:nth-child(8),\n    .prayer-flags span:nth-child(13) { background: #b83a32; }\n    .prayer-flags span:nth-child(4),\n    .prayer-flags span:nth-child(9),\n    .prayer-flags span:nth-child(14) { background: #3d7b50; }\n    .prayer-flags span:nth-child(5),\n    .prayer-flags span:nth-child(10),\n    .prayer-flags span:nth-child(15) { background: #d5ad38; }\n    .prayer-flags span:nth-child(1),\n    .prayer-flags span:nth-child(15) { transform: translateY(0); }\n    .prayer-flags span:nth-child(2),\n    .prayer-flags span:nth-child(14) { transform: translateY(5px); }\n    .prayer-flags span:nth-child(3),\n    .prayer-flags span:nth-child(13) { transform: translateY(10px); }\n    .prayer-flags span:nth-child(4),\n    .prayer-flags span:nth-child(12) { transform: translateY(15px); }\n    .prayer-flags span:nth-child(5),\n    .prayer-flags span:nth-child(11) { transform: translateY(19px); }\n    .prayer-flags span:nth-child(6),\n    .prayer-flags span:nth-child(10) { transform: translateY(23px); }\n    .prayer-flags span:nth-child(7),\n    .prayer-flags span:nth-child(9) { transform: translateY(26px); }\n    .prayer-flags span:nth-child(8) { transform: translateY(28px); }\n\n    .nepal-map-watermark {\n      position: absolute;\n      top: 50%;\n      left: 50%;\n      z-index: 1;\n      width: 76%;\n      height: auto;\n      color: var(--green);\n      opacity: 0.11;\n      transform: translate(-50%, -50%) rotate(-2deg);\n      pointer-events: none;\n      filter: drop-shadow(0 8px 20px rgba(23, 77, 47, 0.08));\n    }\n\n    .nepal-map-watermark path {\n      fill: rgba(247, 240, 228, 0.52);\n      stroke: currentColor;\n      stroke-width: 7;\n      stroke-linejoin: round;\n    }'''
          if old_bg not in text:
              raise SystemExit('Region mandala background block not found')
          text = text.replace(old_bg, new_bg, 1)

          old_icon_css = '''    .mandala-icon {\n      margin-bottom: 5px;\n      font-size: 26px;\n    }'''
          new_icon_css = '''    .mandala-icon {\n      width: 42px;\n      height: 42px;\n      display: inline-flex !important;\n      align-items: center;\n      justify-content: center;\n      margin: 0 auto 7px;\n      border: 1px solid rgba(23, 77, 47, 0.12);\n      border-radius: 50%;\n      background: rgba(23, 77, 47, 0.08);\n      color: var(--green);\n      font-size: 17px;\n    }\n\n    .mandala-option.active .mandala-icon {\n      border-color: rgba(255, 255, 255, 0.3);\n      background: rgba(255, 255, 255, 0.2);\n      color: var(--white);\n    }'''
          if old_icon_css not in text:
              raise SystemExit('Mandala icon CSS block not found')
          text = text.replace(old_icon_css, new_icon_css, 1)

          old_card_css = '''    .region-card-top {\n      position: relative;\n      min-height: 150px;\n      padding: 24px;\n      background:\n        radial-gradient(\n          circle at top right,\n          rgba(230, 195, 106, 0.35),\n          transparent 38%\n        ),\n        linear-gradient(135deg, #eaf3df, #fff8ea);\n    }\n\n    .region-card-top::after {\n      content: "✦";\n      position: absolute;\n      right: 22px;\n      bottom: 8px;\n      color: rgba(23, 77, 47, 0.1);\n      font-family: "Playfair Display", serif;\n      font-size: 76px;\n    }'''
          new_card_css = '''    .region-card-top {\n      position: relative;\n      min-height: 190px;\n      display: flex;\n      flex-direction: column;\n      justify-content: flex-end;\n      padding: 24px;\n      overflow: hidden;\n      background-position: center;\n      background-size: cover;\n      background-repeat: no-repeat;\n    }\n\n    .region-card-top::after {\n      content: "";\n      position: absolute;\n      inset: 0;\n      z-index: 1;\n      background: linear-gradient(\n        to top,\n        rgba(7, 22, 17, 0.76),\n        rgba(7, 22, 17, 0.12) 68%,\n        rgba(7, 22, 17, 0.04)\n      );\n      pointer-events: none;\n    }'''
          if old_card_css not in text:
              raise SystemExit('Region card image CSS block not found')
          text = text.replace(old_card_css, new_card_css, 1)

          text = text.replace('''      background: rgba(255, 255, 255, 0.86);\n      color: var(--green);''', '''      background: rgba(255, 255, 255, 0.9);\n      color: var(--green-dark);''', 1)

          old_region_name = '''    .region-name {\n      position: relative;\n      z-index: 2;\n      max-width: 90%;\n      font-size: 27px;\n      line-height: 1.12;\n    }'''
          new_region_name = '''    .region-name {\n      position: relative;\n      z-index: 2;\n      max-width: 94%;\n      color: var(--white);\n      font-size: 27px;\n      line-height: 1.12;\n      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.34);\n    }'''
          if old_region_name not in text:
              raise SystemExit('Region name CSS block not found')
          text = text.replace(old_region_name, new_region_name, 1)

          old_mobile = '''      .mandala-rings,\n      .mandala-center {\n        display: none;\n      }'''
          new_mobile = '''      .mandala-rings,\n      .mandala-center,\n      .nepal-map-watermark {\n        display: none;\n      }\n\n      .prayer-flags {\n        top: 4px;\n        left: 0;\n        width: 100%;\n        height: 42px;\n        padding: 0 10px;\n        opacity: 0.56;\n      }\n\n      .prayer-flags span {\n        width: 13px;\n        height: 19px;\n      }'''
          if old_mobile not in text:
              raise SystemExit('Mobile mandala hide block not found')
          text = text.replace(old_mobile, new_mobile, 1)

          old_mandala_html = '''      <div class="region-mandala">\n\n        <div class="mandala-rings" aria-hidden="true"></div>'''
          new_mandala_html = '''      <div class="region-mandala">\n\n        <div class="prayer-flags" aria-hidden="true">\n          <span></span><span></span><span></span><span></span><span></span>\n          <span></span><span></span><span></span><span></span><span></span>\n          <span></span><span></span><span></span><span></span><span></span>\n        </div>\n\n        <svg class="nepal-map-watermark" viewBox="0 0 900 280" aria-hidden="true" focusable="false">\n          <path d="M44 151 L91 129 L136 133 L175 109 L222 119 L264 91 L307 103 L344 83 L390 94 L429 75 L474 92 L513 72 L558 91 L598 67 L641 83 L683 64 L728 82 L770 70 L810 88 L852 82 L870 108 L846 124 L812 122 L780 139 L744 132 L706 151 L666 143 L627 164 L589 153 L548 174 L504 165 L464 183 L421 172 L382 190 L341 180 L299 194 L258 183 L217 194 L178 180 L140 184 L107 166 L74 171 Z"/>\n        </svg>\n\n        <div class="mandala-rings" aria-hidden="true"></div>'''
          if old_mandala_html not in text:
              raise SystemExit('Region mandala HTML anchor not found')
          text = text.replace(old_mandala_html, new_mandala_html, 1)

          icon_replacements = {\n            '<span class="mandala-icon">⭐</span>': '<span class="mandala-icon" aria-hidden="true"><i class="fa-solid fa-star"></i></span>',\n            '<span class="mandala-icon">🏔️</span>': '<span class="mandala-icon" aria-hidden="true"><i class="fa-solid fa-mountain-sun"></i></span>',\n            '<span class="mandala-icon">🧭</span>': '<span class="mandala-icon" aria-hidden="true"><i class="fa-solid fa-compass"></i></span>',\n            '<span class="mandala-icon">🛕</span>': '<span class="mandala-icon" aria-hidden="true"><i class="fa-solid fa-landmark"></i></span>',\n            '<span class="mandala-icon">🐅</span>': '<span class="mandala-icon" aria-hidden="true"><i class="fa-solid fa-paw"></i></span>',\n            '<span class="mandala-icon">🌿</span>': '<span class="mandala-icon" aria-hidden="true"><i class="fa-solid fa-leaf"></i></span>',\n          }
          for old, new in icon_replacements.items():
              if old not in text:
                  raise SystemExit(f'Region emoji icon not found: {old}')
              text = text.replace(old, new, 1)

          js_anchor = '''    const mandalaNames = {\n      classic: "Classic Nepal",\n      basecamp: "Himalayan Base Camps",\n      hidden: "Hidden Trails & Remote Valleys",\n      culture: "Culture, Heritage & Villages",\n      wildlife: "Wildlife, Wetlands & Terai",\n      farwest: "Far-West Nepal"\n    };'''
          js_insert = js_anchor + '''\n\n    const regionCategoryImages = {\n      classic: "https://i.postimg.cc/JzZmBkdB/cultural-journey.jpg",\n      basecamp: "https://i.postimg.cc/13BrvgLB/everest-view-trek-jpg.jpg",\n      hidden: "https://i.postimg.cc/FHpVTf2H/rara_lake_expeditions_jpg.jpg",\n      culture: "https://i.postimg.cc/xTr58Vvc/kathmandu-heritage-tour-jpg.jpg",\n      wildlife: "https://images.unsplash.com/photo-1444464666168-49d633b86797?auto=format&fit=crop&w=1200&q=80",\n      farwest: "https://i.postimg.cc/FHpVTf2H/rara_lake_expeditions_jpg.jpg"\n    };\n\n    const regionImageOverrides = {\n      "kathmandu-valley": "https://i.postimg.cc/xTr58Vvc/kathmandu-heritage-tour-jpg.jpg",\n      "pokhara-annapurna": "https://i.postimg.cc/4NCPyR69/pokhara-experience-jpg.jpg",\n      "everest-region": "https://i.postimg.cc/13BrvgLB/everest-view-trek-jpg.jpg",\n      "bandipur": "https://i.postimg.cc/sXQPfT1b/village-immersion-jpg.jpg",\n      "everest-base-camp": "https://i.postimg.cc/13BrvgLB/everest-view-trek-jpg.jpg",\n      "annapurna-base-camp": "https://i.postimg.cc/VNHBcxsc/annapurna-base-camp-jpg.jpg",\n      "mardi-himal-base-camp": "https://i.postimg.cc/4NCPyR69/pokhara-experience-jpg.jpg",\n      "rara-lake-mugu": "https://i.postimg.cc/FHpVTf2H/rara_lake_expeditions_jpg.jpg",\n      "ghalegaun-ghanpokhara": "https://i.postimg.cc/sXQPfT1b/village-immersion-jpg.jpg"\n    };'''
          if js_anchor not in text:
              raise SystemExit('Mandala names JS anchor not found')
          text = text.replace(js_anchor, js_insert, 1)

          old_nav_const = '''    const navLinks =\n      document.getElementById("navLinks");\n\n    let activeFilter = "classic";'''
          new_nav_const = '''    const navLinks =\n      document.getElementById("navLinks");\n\n    const regionMandala =\n      document.querySelector(".region-mandala");\n\n    let activeFilter = "classic";\n\n    function getRegionImage(region) {\n      return regionImageOverrides[region.slug] ||\n        regionCategoryImages[region.category] ||\n        regionCategoryImages.classic;\n    }\n\n    function updateMandalaVisual() {\n      const image =\n        regionCategoryImages[activeFilter] || regionCategoryImages.classic;\n\n      regionMandala.style.setProperty(\n        "--region-bg",\n        `url("${image}")`\n      );\n\n      regionMandala.dataset.activeRegion = activeFilter;\n    }'''
          if old_nav_const not in text:
              raise SystemExit('Navigation JS anchor not found')
          text = text.replace(old_nav_const, new_nav_const, 1)

          old_render_anchor = '''      const category =\n        categoryInformation[activeFilter];\n\n      regionTitle.textContent ='''
          new_render_anchor = '''      const category =\n        categoryInformation[activeFilter];\n\n      updateMandalaVisual();\n\n      regionTitle.textContent ='''
          if old_render_anchor not in text:
              raise SystemExit('renderRegions category anchor not found')
          text = text.replace(old_render_anchor, new_render_anchor, 1)

          old_card_markup = '''              <article class="region-card">\n\n                <div class="region-card-top">'''
          new_card_markup = '''              <article class="region-card">\n\n                <div\n                  class="region-card-top"\n                  style="background-image: url('${escapeHTML(getRegionImage(region))}');"\n                >'''
          if old_card_markup not in text:
              raise SystemExit('Region card markup anchor not found')
          text = text.replace(old_card_markup, new_card_markup, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Regions visual update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('regions/index.html').read_text(encoding='utf-8')
          required = [
            'class="prayer-flags"',
            'class="nepal-map-watermark"',
            'const regionCategoryImages',
            'const regionImageOverrides',
            'function updateMandalaVisual()',
            'fa-star', 'fa-mountain-sun', 'fa-compass', 'fa-landmark', 'fa-paw', 'fa-leaf',
            "style=\"background-image: url('${escapeHTML(getRegionImage(region))}');\""
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected Regions visual update: {item}')
          for emoji in ['⭐','🏔️','🧭','🛕','🐅','🌿']:
              if emoji in text:
                  raise SystemExit(f'Old Region selector emoji remains: {emoji}')
          print('Regions Nepal-specific visual update validated.')
          PY

      - name: Commit Regions visual update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regions/index.html
          git commit -m 'Add Nepal visual identity to Regions selector and cards'
          git push
