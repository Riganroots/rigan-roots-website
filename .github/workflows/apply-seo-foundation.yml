name: Apply SEO foundation improvements
on:
  push:
    branches:
      - feature/phase-4-seo-foundation
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-4-seo-foundation
      - name: Apply SEO updates
        run: python3 .github/seo_apply.py
      - name: Commit SEO changes and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-seo-foundation.yml .github/seo_apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add SEO foundation and dynamic package metadata'
          git push origin HEAD:feature/phase-4-seo-foundation
