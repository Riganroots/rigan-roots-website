name: Final clean URL validation

on:
  push:
    branches: [feature/clean-urls-responsive-nav]
    paths: ['.github/workflows/clean-url-final-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, routes, SEO and responsive navigation
        run: |
          for f in *.js; do
            case "$f" in
              firebase-config.js|booking.js|admin.js|quote-admin.js|quote.js) node --check --input-type=module < "$f" ;;
              *) node --check "$f" ;;
            esac
          done
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re

          root = Path('.')
          routes = {
            '/': 'index.html',
            '/experiences/': 'experiences/index.html',
            '/experiences/detail/': 'experiences/detail/index.html',
            '/regions/': 'regions/index.html',
            '/about/': 'about/index.html',
            '/contact/': 'contact/index.html',
            '/plan/': 'plan/index.html',
            '/work-with-us/': 'work-with-us/index.html',
            '/booking/': 'booking/index.html',
            '/quote/': 'quote/index.html',
            '/admin/': 'admin/index.html',
          }
          old = ['index.html','experience-v2.html','experience-detail-v2.html','regions.html','about.html','contact.html','plan.html','work-with-us.html','booking.html','quote.html','admin.html']

          class RefParser(HTMLParser):
            def __init__(self): super().__init__(); self.refs=[]
            def handle_starttag(self, tag, attrs):
              for key, value in attrs:
                if key in {'href','src','action','poster'} and value:
                  self.refs.append((key, value))

          active_files = [root/'index.html', root/'sitemap.xml', root/'analytics.js', root/'booking-link.js', root/'booking.js', root/'quote-admin.js']
          active_files += [root/p for p in routes.values() if p != 'index.html']
          for file in active_files:
            text = file.read_text(encoding='utf-8')
            # Explicit index.html only appears in analytics.js as the intentional normalizer regex/comment.
            legacy = old[1:] if file.name == 'analytics.js' else old
            hits = [name for name in legacy if name in text]
            assert not hits, f'Legacy route reference in {file}: {hits}'

          for route, rel in routes.items():
            page = root/rel
            assert page.exists() and page.stat().st_size > 200, f'Missing/empty route {route}'
            text = page.read_text(encoding='utf-8')
            assert re.search(r'<meta[^>]+name=["\']viewport["\']', text, re.I), f'No viewport in {rel}'
            if route not in {'/booking/','/quote/','/admin/','/experiences/detail/'}:
              canonical = 'https://riganrootsroutes.com' + route
              assert canonical in text, f'Canonical not updated in {rel}'
            parser = RefParser(); parser.feed(text)
            for attr, ref in parser.refs:
              if ref.startswith(('http://','https://','mailto:','tel:','data:','javascript:','#','?','//')):
                continue
              assert ref.startswith('/'), f'Non-root-relative local {attr} in {rel}: {ref}'
              path = urlsplit(ref).path
              if not path or path == '/': continue
              candidate = root/path.lstrip('/')
              if path.endswith('/'): candidate = candidate/'index.html'
              if path.startswith('/images/'): continue
              assert candidate.exists(), f'Missing local target from {rel}: {ref}'

          for legacy, target in {
            'experience-v2.html':'/experiences/', 'experience-detail-v2.html':'/experiences/detail/',
            'regions.html':'/regions/', 'about.html':'/about/', 'contact.html':'/contact/',
            'plan.html':'/plan/', 'work-with-us.html':'/work-with-us/', 'booking.html':'/booking/',
            'quote.html':'/quote/', 'admin.html':'/admin/'
          }.items():
            text = (root/legacy).read_text(encoding='utf-8')
            assert 'noindex,follow' in text and target in text and 'location.replace' in text, f'Bad legacy redirect {legacy}'

          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8')
          for route in ['/experiences/','/regions/','/about/','/contact/','/plan/','/work-with-us/']:
            assert f'https://riganrootsroutes.com{route}' in sitemap
          assert '.html' not in sitemap, 'Legacy .html URL remains in sitemap'

          analytics = (root/'analytics.js').read_text(encoding='utf-8')
          assert "normalizedPath === '/experiences/detail'" in analytics
          assert "window.location.replace(cleanPath" in analytics
          booking_link = (root/'booking-link.js').read_text(encoding='utf-8')
          assert "pathname !== '/experiences/detail'" in booking_link

          css = (root/'mobile-consistency.css').read_text(encoding='utf-8')
          for token in ['max-width: 1024px', 'max-width: 900px', 'max-width: 430px', '100dvh', 'min-height: 44px']:
            assert token in css, f'Missing responsive safeguard: {token}'
          print('Static URL, SEO, asset, analytics and responsive checks passed.')
          PY
      - name: Smoke test clean directory routes
        run: |
          python -m http.server 8000 >/tmp/rigan-http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          for route in / /experiences/ /experiences/detail/ /regions/ /about/ /contact/ /plan/ /work-with-us/ /booking/ /quote/ /admin/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$route")
            test "$code" = "200" || { echo "$route returned $code"; exit 1; }
          done
          echo 'All clean directory routes returned HTTP 200.'
