name: Clean URL migration

on:
  push:
    branches: [feature/clean-urls-responsive-nav]
    paths:
      - 'scripts/clean_url_migration.py'
      - '.github/workflows/clean-url-migration.yml'

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect repository structure
        run: |
          echo 'HTML pages:'
          find . -maxdepth 3 -type f -name '*.html' -print | sort
          echo 'Internal legacy filename references before migration:'
          grep -RInE '(index|experience-v2|experience-detail-v2|regions|about|contact|plan|work-with-us|booking|quote|admin)\.html' \
            --include='*.html' --include='*.js' --include='*.xml' . || true

      - name: Run clean URL migration
        run: python scripts/clean_url_migration.py

      - name: Validate JavaScript syntax
        run: |
          for f in *.js; do
            case "$f" in
              firebase-config.js|booking.js|admin.js|quote-admin.js|quote.js) node --check --input-type=module < "$f" ;;
              *) node --check "$f" ;;
            esac
          done

      - name: Validate clean routes and asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re

          root = Path('.')
          route_pages = [
              'index.html', 'experiences/index.html', 'experiences/detail/index.html',
              'regions/index.html', 'about/index.html', 'contact/index.html',
              'plan/index.html', 'work-with-us/index.html', 'booking/index.html',
              'quote/index.html', 'admin/index.html'
          ]
          for rel in route_pages:
              p = root / rel
              assert p.exists() and p.stat().st_size > 200, f'Bad route page: {rel}'
              text = p.read_text(encoding='utf-8')
              assert re.search(r'<meta[^>]+name=["\']viewport["\']', text, re.I), f'No viewport: {rel}'

          old = ['experience-v2.html','experience-detail-v2.html','regions.html','about.html','contact.html','plan.html','work-with-us.html','booking.html','quote.html','admin.html']
          current = [root/'index.html', root/'sitemap.xml'] + list(root.glob('*.js')) + [root/r for r in route_pages[1:]]
          for p in current:
              text = p.read_text(encoding='utf-8')
              hits = [x for x in old if x in text]
              assert not hits, f'Legacy links in {p}: {hits}'

          sitemap = (root/'sitemap.xml').read_text(encoding='utf-8')
          for route in ['/experiences/','/regions/','/about/','/contact/','/plan/','/work-with-us/']:
              assert f'https://riganrootsroutes.com{route}' in sitemap, f'Sitemap missing {route}'

          class RefParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k in {'href','src','action','poster'} and v:
                          self.refs.append((k,v))

          for rel in route_pages:
              parser = RefParser(); parser.feed((root/rel).read_text(encoding='utf-8'))
              for attr, ref in parser.refs:
                  if ref.startswith(('http://','https://','mailto:','tel:','data:','javascript:','#','?','//')):
                      continue
                  assert ref.startswith('/'), f'Non-root-relative local {attr} in {rel}: {ref}'
                  path = urlsplit(ref).path
                  if not path or path == '/':
                      continue
                  candidate = root / path.lstrip('/')
                  if path.endswith('/'):
                      candidate = candidate / 'index.html'
                  if path.startswith('/images/'):
                      continue
                  assert candidate.exists(), f'Missing local target from {rel}: {ref}'

          print('Route, viewport, link, sitemap and local asset checks passed.')
          PY

      - name: Smoke test GitHub-Pages-style directory routes
        run: |
          python -m http.server 8000 >/tmp/rigan-http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          for route in / /experiences/ /regions/ /about/ /contact/ /plan/ /work-with-us/ /booking/ /quote/ /admin/; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8000$route")
            test "$code" = "200" || { echo "$route returned $code"; exit 1; }
            grep -qi '<meta[^>]*name="viewport"' /tmp/page.html || { echo "$route missing viewport"; exit 1; }
          done
          echo 'Clean route smoke tests passed.'

      - name: Commit migrated website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
          else
            git commit -m 'Migrate site to clean GitHub Pages URLs'
            git push origin HEAD:feature/clean-urls-responsive-nav
          fi

# Triggered after workflow registration on the feature branch.
