name: Patch contact mobile menu
on:
  push:
    branches:
      - fix/phase-2-mobile-consistency
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-2-mobile-consistency
      - name: Patch Contact menu
        run: |
          perl -0pi -e 's/menuToggle\.contains\(event\.target\);/menuToggle.contains(event.target) || event.composedPath().includes(menuToggle);/' contact.html
          grep -q 'event.composedPath().includes(menuToggle)' contact.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contact.html
          git commit -m 'Fix Contact mobile menu outside-click handling'
          git push origin HEAD:fix/phase-2-mobile-consistency
