name: Debug trek package preview text
on:
  push:
    branches: [feature/phase-3-trek-package-specs]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-3-trek-package-specs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Print trek panel text
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844}});
            await page.goto('https://deploy-preview-8--rigan.netlify.app/experience-detail-v2.html?experience=everest-base-camp-trek',{waitUntil:'networkidle',timeout:45000});
            const count=await page.locator('.trek-facts-panel').count();
            console.log('COUNT',count);
            if(count){
              const text=await page.locator('.trek-facts-panel').innerText();
              console.log('PANEL_TEXT_START');
              console.log(text);
              console.log('PANEL_TEXT_END');
              console.log('HAS_TYPICAL',text.includes('Typical Walking'));
              console.log('HAS_ACCOM',text.includes('Accommodation'));
              console.log('HAS_PERMITS',text.includes('Permits'));
            }
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            await page.waitForTimeout(200);
            console.log('ERRORS',JSON.stringify(errors));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove debug workflow
        if: always()
        run: |
          rm -f .github/workflows/debug-trek-panel.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/debug-trek-panel.yml
          git commit -m 'Remove temporary trek panel debug workflow'
          git push origin HEAD:feature/phase-3-trek-package-specs
