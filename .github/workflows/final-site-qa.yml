name: Final site QA

on:
  push:
    branches:
      - qa/final-live-site-audit
    paths:
      - '.github/workflows/final-site-qa.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/final-live-site-audit

      - name: Static site audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re, sys
          from collections import Counter

          root = Path('.')
          html_files = sorted(p for p in root.rglob('*.html') if '.git' not in p.parts)
          all_files = {p.as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          errors = []
          warnings = []

          def local_target_exists(page, raw):
              raw = raw.strip()
              if not raw or raw.startswith(('#','mailto:','tel:','javascript:','data:')):
                  return True
              if '${' in raw or '{{' in raw:
                  return True
              if raw.startswith('//'):
                  errors.append(f'{page}: protocol-relative URL found: {raw}')
                  return True
              parts = urlsplit(raw)
              if parts.scheme in ('http','https'):
                  return True
              path = parts.path
              if not path:
                  return True
              if path.startswith('/'):
                  rel = Path(path.lstrip('/'))
              else:
                  rel = page.parent / path
              candidates = []
              if path.endswith('/'):
                  candidates.append(rel / 'index.html')
              else:
                  candidates.extend([rel, Path(str(rel) + '.html'), rel / 'index.html'])
              return any(c.as_posix() in all_files for c in candidates)

          attr_re = re.compile(r'''\b(?:href|src|action)\s*=\s*["']([^"']+)["']''', re.I)
          id_re = re.compile(r'''\bid\s*=\s*["']([^"']+)["']''', re.I)

          for page in html_files:
              text = page.read_text(encoding='utf-8', errors='replace')
              for raw in attr_re.findall(text):
                  if not local_target_exists(page, raw):
                      errors.append(f'{page}: missing local target: {raw}')
              ids = id_re.findall(text)
              dupes = sorted(k for k,v in Counter(ids).items() if v > 1)
              if dupes:
                  errors.append(f'{page}: duplicate id(s): {", ".join(dupes)}')
              if '<meta name="viewport"' not in text and "<meta name='viewport'" not in text:
                  warnings.append(f'{page}: missing viewport meta')
              if '<title>' not in text.lower():
                  warnings.append(f'{page}: missing title')
              if re.search(r'''href\s*=\s*["']#["']''', text, re.I):
                  warnings.append(f'{page}: contains href="#" placeholder')

          # Check sitemap quality.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              s = sitemap.read_text(encoding='utf-8', errors='replace')
              locs = re.findall(r'<loc>(.*?)</loc>', s)
              dupes = [u for u,c in Counter(locs).items() if c > 1]
              if dupes:
                  errors.append('sitemap.xml: duplicate URLs: ' + ', '.join(dupes))
              bad = [u for u in locs if u.endswith('.html')]
              if bad:
                  warnings.append('sitemap.xml: legacy .html URLs remain: ' + ', '.join(bad))
          else:
              errors.append('sitemap.xml missing')

          # Core production pages should keep essential SEO/navigation/conversion anchors.
          core = {
              'index.html': ['rel="canonical"', '/experiences/', '/regions/', '/plan/', 'wa.me/9779843322695'],
              'experiences/index.html': ['rel="canonical"', '/experiences/detail/', '/plan/'],
              'regions/index.html': ['rel="canonical"', '/plan/'],
              'plan/index.html': ['rel="canonical"', 'wa.me/9779843322695'],
              'experiences/detail/index.html': ['rel="canonical"', 'id="inquiryForm"', 'id="whatsappBtn"', 'id="bookingCard"'],
          }
          for filename, required in core.items():
              p = Path(filename)
              if not p.exists():
                  errors.append(f'core page missing: {filename}')
                  continue
              t = p.read_text(encoding='utf-8', errors='replace')
              for marker in required:
                  if marker not in t:
                      errors.append(f'{filename}: missing required marker {marker}')

          # Recent detail redesigns landed in both HTML and booking-link.js; flag overlap for review.
          detail = Path('experiences/detail/index.html').read_text(encoding='utf-8', errors='replace')
          booking = Path('booking-link.js').read_text(encoding='utf-8', errors='replace') if Path('booking-link.js').exists() else ''
          if '.detail-hero::before' in detail and 'injectDetailStyles' in booking:
              warnings.append('Experience detail has premium styling in both static HTML and booking-link.js; review for duplicated visual layers/spacing.')
          if 'hero-actions' in detail and 'trip-quick-nav' in booking:
              warnings.append('Experience detail has two separate CTA/navigation enhancement layers; review mobile density after recent merges.')

          print(f'HTML pages scanned: {len(html_files)}')
          print('\nWARNINGS')
          for item in warnings:
              print('WARN:', item)
          print('\nERRORS')
          for item in errors:
              print('ERROR:', item)
          print(f'\nSummary: {len(errors)} error(s), {len(warnings)} warning(s)')
          if errors:
              sys.exit(1)
          PY

      - name: JavaScript syntax audit
        if: always()
        shell: bash
        run: |
          set -e
          failed=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            if ! node --check "$file"; then failed=1; fi
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          exit "$failed"

      - name: Live production smoke test
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, ssl, sys, time

          checks = [
              ('https://riganrootsroutes.com/', 'Rigan Roots'),
              ('https://riganrootsroutes.com/experiences/', 'Experiences'),
              ('https://riganrootsroutes.com/regions/', 'Regions'),
              ('https://riganrootsroutes.com/plan/', 'Plan'),
              ('https://riganrootsroutes.com/about/', 'Rigan'),
              ('https://riganrootsroutes.com/contact/', 'Contact'),
              ('https://riganrootsroutes.com/experiences/detail/?experience=annapurna-base-camp-trek', 'Annapurna'),
          ]
          failures = []
          ctx = ssl.create_default_context()
          for url, marker in checks:
              req = urllib.request.Request(url, headers={'User-Agent':'Rigan-QA/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                      body = r.read().decode('utf-8', 'replace')
                      print(r.status, r.geturl(), len(body), 'bytes')
                      if r.status != 200:
                          failures.append(f'{url}: HTTP {r.status}')
                      if marker.lower() not in body.lower():
                          failures.append(f'{url}: marker not found: {marker}')
              except Exception as e:
                  failures.append(f'{url}: {e}')
              time.sleep(.4)
          if failures:
              print('\nLIVE FAILURES')
              for x in failures: print('FAIL:', x)
              sys.exit(1)
          print('Live production smoke test passed')
          PY
