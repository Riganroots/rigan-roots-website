name: Full site audit

# Rerun after applying site fixes.
on:
  push:
    branches:
      - fix/full-site-audit-sep17
    paths:
      - '.github/workflows/full-site-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-site-audit-sep17

      - name: Static route and asset audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlsplit

          root = Path('.')
          html_files = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          issues = []
          warnings = []

          attr_re = re.compile(r'''(?:href|src|action)\s*=\s*["']([^"']+)["']''', re.I)

          def local_target_exists(source, raw):
              raw = raw.strip()
              if not raw or raw.startswith(('#', 'mailto:', 'tel:', 'javascript:', 'data:')):
                  return True
              if '${' in raw or '{{' in raw:
                  return True
              if raw.startswith('//'):
                  host = urlsplit('https:' + raw).netloc
                  if host in {'experiences', 'plan', 'about', 'contact', 'regions', 'booking', 'admin', 'work-with-us'}:
                      return False
                  return True
              if raw.startswith(('http://', 'https://')):
                  return True

              clean = raw.split('#', 1)[0].split('?', 1)[0]
              if not clean:
                  return True

              if clean.startswith('/'):
                  candidate = root / clean.lstrip('/')
              else:
                  candidate = source.parent / clean

              if candidate.is_file():
                  return True
              if candidate.is_dir() and (candidate / 'index.html').is_file():
                  return True
              if str(candidate).endswith('/') and (candidate / 'index.html').is_file():
                  return True
              if candidate.suffix == '' and (candidate / 'index.html').is_file():
                  return True
              return False

          for p in html_files:
              text = p.read_text(encoding='utf-8', errors='replace')
              if text.lstrip().startswith('```') or text.rstrip().endswith('```'):
                  issues.append(f'{p}: markdown fence found in HTML')
              for raw in attr_re.findall(text):
                  if raw == '#':
                      warnings.append(f'{p}: placeholder link href="#"')
                  if raw.startswith('//'):
                      host = urlsplit('https:' + raw).netloc
                      if host in {'experiences', 'plan', 'about', 'contact', 'regions', 'booking', 'admin', 'work-with-us'}:
                          issues.append(f'{p}: malformed protocol-relative internal URL {raw}')
                  if not local_target_exists(p, raw):
                      issues.append(f'{p}: missing local target {raw}')

          bad_patterns = [
              'href="/${', "href='/${", 'src="/${', "src='/${", "url('/${", 'url("/${'
          ]
          for p in list(root.rglob('*.html')) + list(root.rglob('*.js')) + list(root.rglob('*.css')):
              if '.git' in p.parts:
                  continue
              text = p.read_text(encoding='utf-8', errors='replace')
              for pat in bad_patterns:
                  if pat in text:
                      issues.append(f'{p}: malformed dynamic URL pattern {pat}')

          js_files = [p for p in root.rglob('*.js') if '.git' not in p.parts]
          print(f'HTML files scanned: {len(html_files)}')
          print(f'JS files found: {len(js_files)}')

          for p in html_files:
              text = p.read_text(encoding='utf-8', errors='replace')
              m = re.search(r'<meta\s+http-equiv=["\']refresh["\'][^>]*content=["\'][^;]+;\s*url=([^"\']+)', text, re.I)
              if m:
                  target = m.group(1).strip()
                  if not local_target_exists(p, target):
                      issues.append(f'{p}: redirect target missing {target}')

          print('\nWARNINGS')
          for w in sorted(set(warnings)):
              print('WARN:', w)

          print('\nISSUES')
          for i in sorted(set(issues)):
              print('ERROR:', i)

          if issues:
              raise SystemExit(f'Found {len(set(issues))} blocking static issues')
          print('No blocking static route/asset issues found.')
          PY

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -e
          for f in $(find . -name '*.js' -not -path './.git/*'); do
            node --check "$f"
          done

      - name: Sitemap sanity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('sitemap.xml').read_text(encoding='utf-8')
          urls = re.findall(r'<loc>(.*?)</loc>', text)
          dupes = sorted({u for u in urls if urls.count(u) > 1})
          print('Sitemap URLs:', len(urls))
          if dupes:
              raise SystemExit('Duplicate sitemap URLs: ' + ', '.join(dupes))
          print('No duplicate sitemap URLs.')
          PY
