name: Phase 7A booking setup

on:
  push:
    branches: [feature/phase-7a-booking-admin]
    paths: ['.github/workflows/phase-7a-setup.yml']

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-7a-booking-admin
      - name: Link booking CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experience-detail-v2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="booking-link.js"></script>'
          if tag not in s:
              anchor='<script src="experience-localizer.js" defer></script>'
              if anchor not in s: raise SystemExit('anchor missing')
              s=s.replace(anchor, anchor+'\n'+tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate Phase 7A files
        run: |
          node --check booking-link.js
          node --check --input-type=module < firebase-config.js
          node --check --input-type=module < booking.js
          node --check --input-type=module < admin.js
          python - <<'PY'
          from pathlib import Path
          required=['booking.html','booking.js','booking.css','admin.html','admin.js','admin.css','firebase-config.js','firestore.rules','FIREBASE_SETUP.md']
          for f in required:
              if not Path(f).exists(): raise SystemExit(f'Missing {f}')
          detail=Path('experience-detail-v2.html').read_text(encoding='utf-8')
          if detail.count('booking-link.js') != 1: raise SystemExit('booking-link.js integration invalid')
          rules=Path('firestore.rules').read_text(encoding='utf-8')
          for text in ['match /bookings/{bookingId}','match /admins/{userId}','allow create: if validPublicBooking()','allow read, update, delete: if isAdmin()']:
              if text not in rules: raise SystemExit(f'Rule missing: {text}')
          print('Phase 7A validation passed')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experience-detail-v2.html
          git commit -m 'Connect package pages to booking flow'
          git push
