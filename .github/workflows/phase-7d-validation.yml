name: Phase 7D quotation validation

on:
  push:
    branches: [feature/phase-7d-quotation-system]
    paths: ['.github/workflows/phase-7d-validation.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate quotation system
        run: |
          node --check --input-type=module < quote-admin.js
          node --check --input-type=module < quote.js
          node --check --input-type=module < admin.js
          python - <<'PY'
          from pathlib import Path
          admin = Path('admin.html').read_text(encoding='utf-8')
          qadmin = Path('quote-admin.js').read_text(encoding='utf-8')
          quote = Path('quote.html').read_text(encoding='utf-8')
          qjs = Path('quote.js').read_text(encoding='utf-8')
          rules = Path('firestore.rules').read_text(encoding='utf-8')
          for token in ['quoteBuilder','publishQuoteBtn','quoteItinerary','quoteDeposit','quoteValidUntil','quote-admin.js']:
              if token not in admin: raise SystemExit(f'Missing admin quote token: {token}')
          for token in ['secureToken','publicQuotes','quoteHistory','supersedeOldQuote','loadPackageDefaults']:
              if token not in qadmin: raise SystemExit(f'Missing quote admin feature: {token}')
          for token in ['acceptQuoteBtn','Print / Save PDF','paymentTerms','cancellationTerms']:
              if token not in quote: raise SystemExit(f'Missing public quote token: {token}')
          for token in ['writeBatch','quoteAcceptedToken','Confirmed','publicQuotes']:
              if token not in qjs: raise SystemExit(f'Missing quote acceptance feature: {token}')
          for token in ['validQuoteAcceptance','validPublicQuoteAcceptance','allow get: if true','quoteAcceptedVersion']:
              if token not in rules: raise SystemExit(f'Missing rule token: {token}')
          if 'service cloud.firestore' not in rules or rules.count('{') != rules.count('}'):
              raise SystemExit('Firestore rules braces are unbalanced')
          print('Phase 7D static validation passed')
          PY
