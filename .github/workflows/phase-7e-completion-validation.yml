name: Phase 7E completion validation
on:
  push:
    branches: [feature/phase-7e-payments-completion]
    paths: ['.github/workflows/phase-7e-completion-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check --input-type=module < payment-admin.js
          node --check --input-type=module < receipt.js
          python - <<'PY'
          from pathlib import Path
          admin=Path('admin.html').read_text()
          pjs=Path('payment-admin.js').read_text()
          receipt=Path('receipt.html').read_text()
          rules=Path('firestore.rules').read_text()
          assert 'payment-admin.js' in admin and 'recordPaymentBtn' in admin
          assert 'runTransaction' in pjs and 'publicReceipts' in pjs and "booking.status === 'Paid'" in pjs
          assert 'Print / Save PDF' in receipt and 'receipt-disclaimer' in receipt
          assert 'match /publicReceipts/{receiptToken}' in rules and 'allow get: if true;' in rules
          assert rules.count('{') == rules.count('}')
          print('Phase 7E completion validation passed')
          PY
