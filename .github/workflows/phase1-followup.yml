name: Phase 1 follow-up checks

on:
  push:
    paths:
      - '.github/workflows/phase1-followup.yml'

permissions:
  contents: write

jobs:
  phase1-followup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-1-site-stability

      - name: Fix remaining Plan page mismatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('plan.html')
          text = path.read_text(encoding='utf-8')
          old = 'data-exp="everest-base-camp"'
          new = 'data-exp="everest-base-camp-trek"'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Updated Plan page mountain selector to canonical experience ID.')
          else:
              print('Plan page mountain selector already uses canonical ID.')
          PY

      - name: Run Phase 1 static checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re, subprocess, tempfile, sys

          root = Path('.')
          html_files = sorted(root.glob('*.html'))
          errors = []
          warnings = []

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'):
                      self.ids.append(attrs['id'])
                  for key in ('href', 'src'):
                      if attrs.get(key):
                          self.refs.append((key, attrs[key]))

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              if re.search(r'(?m)^```(?:html)?\s*$', text):
                  errors.append(f'{path}: contains Markdown code fence')
              if 'guides.html' in text or 'marketplace.html' in text:
                  errors.append(f'{path}: contains link to missing guides/marketplace page')

              parser = Parser()
              try:
                  parser.feed(text)
              except Exception as exc:
                  errors.append(f'{path}: HTML parser error: {exc}')

              seen = set()
              for item_id in parser.ids:
                  if item_id in seen:
                      warnings.append(f'{path}: duplicate id {item_id}')
                  seen.add(item_id)

              for kind, ref in parser.refs:
                  ref = ref.strip()
                  if not ref or ref.startswith(('#', 'http://', 'https://', '//', 'mailto:', 'tel:', 'javascript:', 'data:')):
                      continue
                  target = urlsplit(ref).path
                  if not target:
                      continue
                  target_path = (path.parent / target.lstrip('/')).resolve()
                  if target.endswith('.html') or target.endswith('.js') or target.endswith('.css') or target.endswith('.svg'):
                      try:
                          target_path.relative_to(root.resolve())
                      except ValueError:
                          continue
                      if not target_path.exists():
                          errors.append(f'{path}: missing local {kind} target {ref}')
                  elif kind == 'src' and target.startswith('images/') and not target_path.exists():
                      warnings.append(f'{path}: missing local image {ref} (handled with fallback/hide if intentional)')

              scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.S | re.I)
              for idx, script in enumerate(scripts, 1):
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as tmp:
                      tmp.write(script)
                      tmp_path = tmp.name
                  result = subprocess.run(['node', '--check', tmp_path], text=True, capture_output=True)
                  if result.returncode:
                      errors.append(f'{path}: inline script {idx} syntax error: {result.stderr.strip()}')

          for js in sorted(root.glob('*.js')):
              result = subprocess.run(['node', '--check', str(js)], text=True, capture_output=True)
              if result.returncode:
                  errors.append(f'{js}: JavaScript syntax error: {result.stderr.strip()}')

          plan = Path('plan.html').read_text(encoding='utf-8')
          if 'data-exp="everest-base-camp-trek"' not in plan:
              errors.append('plan.html: mountain mood button does not use everest-base-camp-trek')

          data = Path('experience-data-v2.js').read_text(encoding='utf-8')
          ids = set(re.findall(r'\bid:\s*["\']([^"\']+)["\']', data))
          plan_links = set()
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              plan_links.update(re.findall(r'plan\.html\?experience=([a-z0-9-]+)', text))
          missing_ids = sorted(x for x in plan_links if x not in ids)
          if missing_ids:
              warnings.append('Plan links not present in experience-data-v2.js: ' + ', '.join(missing_ids))

          print('HTML files checked:', ', '.join(p.name for p in html_files))
          print('Experience IDs found:', len(ids))
          print('Static plan links found:', ', '.join(sorted(plan_links)) if plan_links else 'none')
          for warning in warnings:
              print('WARNING:', warning)
          for error in errors:
              print('ERROR:', error)
          if errors:
              sys.exit(1)
          print('Phase 1 static checks passed.')
          PY

      - name: Remove temporary workflow and commit follow-up
        shell: bash
        run: |
          rm -f .github/workflows/phase1-followup.yml
          if git diff --quiet; then
            echo 'No follow-up changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plan.html .github/workflows/phase1-followup.yml
          git commit -m 'Fix remaining Phase 1 plan selector issue'
          git push origin HEAD:fix/phase-1-site-stability
