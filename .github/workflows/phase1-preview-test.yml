name: Phase 1 preview browser test

on:
  push:
    branches:
      - fix/phase-1-followup-clean
    paths:
      - '.github/workflows/phase1-preview-test.yml'

permissions:
  contents: write

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-1-followup-clean

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Test Netlify deploy preview
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = 'https://deploy-preview-3--rigan.netlify.app';
          const results = [];
          const failures = [];
          const warn = [];
          const pass = (name) => { results.push('PASS: ' + name); };
          const fail = (name, detail='') => { failures.push('FAIL: ' + name + (detail ? ' — ' + detail : '')); };
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(e.message));
          page.on('console', msg => { if (msg.type()==='error') warn.push('console: '+msg.text()); });

          async function goto(path, name){
            try {
              const response = await page.goto(base + path, {waitUntil:'networkidle', timeout:45000});
              if (!response || response.status() >= 400) { fail(name, 'HTTP ' + (response ? response.status() : 'no response')); return false; }
              pass(name + ' loads'); return true;
            } catch (e) { fail(name, e.message); return false; }
          }

          await goto('/', 'Home');
          await goto('/experience-v2.html', 'Experiences');
          await goto('/regions.html', 'Regions');
          await goto('/about.html', 'About');
          await goto('/plan.html', 'Plan');
          await goto('/contact.html', 'Contact');
          await goto('/work-with-us.html', 'Work With Us');

          await page.setViewportSize({width:390,height:844});
          if (await goto('/about.html', 'About mobile')) {
            const btn = page.locator('#aboutMenuBtn');
            if (await btn.count()) {
              await btn.click();
              const visible = await page.locator('#aboutNavLinks').evaluate(el => getComputedStyle(el).display !== 'none' && el.classList.contains('active'));
              const expanded = await btn.getAttribute('aria-expanded');
              if (visible && expanded === 'true') pass('About mobile menu opens'); else fail('About mobile menu opens');
              await page.keyboard.press('Escape');
              const closed = await page.locator('#aboutNavLinks').evaluate(el => !el.classList.contains('active'));
              if (closed) pass('About mobile menu closes with Escape'); else fail('About mobile menu closes with Escape');
            } else fail('About mobile menu button exists');
          }

          if (await goto('/work-with-us.html', 'Work With Us mobile')) {
            const btn = page.locator('#hostMenuBtn');
            if (await btn.count()) {
              await btn.click();
              const active = await page.locator('#hostNavLinks').evaluate(el => el.classList.contains('active'));
              if (active) pass('Work With Us mobile menu opens'); else fail('Work With Us mobile menu opens');
            } else fail('Work With Us mobile menu button exists');
          }

          await page.setViewportSize({width:1280,height:900});
          if (await goto('/plan.html?experience=mardi-himal-trek', 'Plan Mardi query')) {
            const val = await page.locator('#experience').inputValue();
            const selectedText = (await page.locator('#experienceText').textContent() || '').trim();
            if (val === 'mardi-himal-trek') pass('Plan preserves Mardi Himal experience slug'); else fail('Plan preserves Mardi Himal experience slug', val);
            if (/Mardi Himal/i.test(selectedText) && !/Live Like a Nepali/i.test(selectedText)) pass('Plan shows Mardi Himal instead of wrong default'); else fail('Plan shows Mardi Himal instead of wrong default', selectedText);
          }

          if (await goto('/plan.html?experience=annapurna-base-camp-trek', 'Plan Annapurna query')) {
            const val = await page.locator('#experience').inputValue();
            const selectedText = (await page.locator('#experienceText').textContent() || '').trim();
            if (val === 'annapurna-base-camp-trek') pass('Plan preserves Annapurna experience slug'); else fail('Plan preserves Annapurna experience slug', val);
            if (/Annapurna Base Camp Trek/i.test(selectedText)) pass('Plan shows Annapurna package title'); else fail('Plan shows Annapurna package title', selectedText);
          }

          if (await goto('/plan.html', 'Plan mountain selector')) {
            const mountain = page.locator('.mood[data-exp="everest-base-camp-trek"]');
            if (await mountain.count()) {
              await mountain.click();
              const val = await page.locator('#experience').inputValue();
              if (val === 'everest-base-camp-trek') pass('Mountains mood selects canonical Everest ID'); else fail('Mountains mood selects canonical Everest ID', val);
            } else fail('Canonical Everest mountains mood button exists');
          }

          const detailSlugs = ['annapurna-base-camp-trek','mardi-himal-trek','shey-phoksundo-trek'];
          for (const slug of detailSlugs) {
            if (await goto('/experience-detail-v2.html?experience=' + slug, 'Detail ' + slug)) {
              const body = await page.locator('body').innerText();
              if (!/Experience Not Found|could not be loaded/i.test(body)) pass('Detail resolves ' + slug); else fail('Detail resolves ' + slug);
            }
          }

          if (await goto('/plan.html?experience=annapurna-base-camp-trek', 'Plan WhatsApp setup')) {
            await page.evaluate(() => { window.open = (url) => { window.__testOpenedUrl = url; return null; }; });
            await page.fill('#name','Preview Test');
            await page.fill('#email','preview@example.com');
            await page.fill('#phone','9800000000');
            await page.selectOption('#duration','7');
            await page.selectOption('#group','2');
            await page.click('#waBtn');
            const wa = await page.evaluate(() => window.__testOpenedUrl || '');
            if (wa.startsWith('https://wa.me/9779843322695?text=')) pass('Plan WhatsApp button builds correct destination'); else fail('Plan WhatsApp button builds correct destination', wa);
            const action = await page.locator('#planForm').getAttribute('action');
            if (action === 'https://formspree.io/f/mbdpwkoz') pass('Plan form points to configured Formspree endpoint'); else fail('Plan form points to configured Formspree endpoint', action || 'missing');
          }

          if (await goto('/contact.html', 'Contact form check')) {
            const forms = page.locator('form');
            if (await forms.count()) {
              const actions = await forms.evaluateAll(fs => fs.map(f => f.getAttribute('action') || ''));
              if (actions.some(a => a.includes('formspree.io/f/mbdpwkoz'))) pass('Contact form points to configured Formspree endpoint'); else fail('Contact form points to configured Formspree endpoint', JSON.stringify(actions));
            } else fail('Contact form exists');
          }

          const localPages = ['index.html','experience-v2.html','experience-detail-v2.html?experience=annapurna-base-camp-trek','regions.html','about.html','plan.html','contact.html','work-with-us.html'];
          for (const p of localPages) {
            try {
              const r = await context.request.get(base + '/' + p, {timeout:30000});
              if (r.status() < 400) pass('HTTP ' + r.status() + ' ' + p); else fail('Local page responds ' + p, 'HTTP ' + r.status());
            } catch (e) { fail('Local page responds ' + p, e.message); }
          }

          if (pageErrors.length) fail('No uncaught page JavaScript errors', pageErrors.join(' | ')); else pass('No uncaught page JavaScript errors during tested flows');

          await browser.close();
          console.log(results.join('\n'));
          if (warn.length) console.log('\nWARNINGS:\n' + [...new Set(warn)].slice(0,20).join('\n'));
          if (failures.length) {
            console.error('\nFAILURES:\n' + failures.join('\n'));
            process.exit(1);
          }
          console.log('\nALL PREVIEW TESTS PASSED');
          NODE

      - name: Remove temporary test workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/phase1-preview-test.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase1-preview-test.yml
          git commit -m 'Remove temporary Phase 1 preview test workflow'
          git push origin HEAD:fix/phase-1-followup-clean
