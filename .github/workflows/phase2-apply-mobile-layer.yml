name: Apply Phase 2 mobile consistency layer
on:
  push:
    branches: [fix/phase-2-mobile-consistency]
permissions:
  contents: write
jobs:
  apply-mobile-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-2-mobile-consistency
      - name: Link shared mobile stylesheet across all pages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
              'index.html',
              'experience-v2.html',
              'experience-detail-v2.html',
              'regions.html',
              'about.html',
              'plan.html',
              'contact.html',
              'work-with-us.html',
          ]
          tag = '<link rel="stylesheet" href="mobile-consistency.css">'
          changed = []
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'mobile-consistency.css' in text:
                  continue
              if '</head>' not in text:
                  raise SystemExit(f'{name}: missing </head>')
              text = text.replace('</head>', f'{tag}\n</head>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Validate linked pages
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = sorted(Path('.').glob('*.html'))
          missing = [p.name for p in pages if 'mobile-consistency.css' not in p.read_text(encoding='utf-8')]
          if missing:
              raise SystemExit('Missing mobile stylesheet link: ' + ', '.join(missing))
          if not Path('mobile-consistency.css').exists():
              raise SystemExit('mobile-consistency.css missing')
          print('All root HTML pages link the shared mobile stylesheet.')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/phase2-apply-mobile-layer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html experience-v2.html experience-detail-v2.html regions.html about.html plan.html contact.html work-with-us.html mobile-consistency.css .github/workflows/phase2-apply-mobile-layer.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Phase 2 mobile consistency fixes'
          git push origin HEAD:fix/phase-2-mobile-consistency
