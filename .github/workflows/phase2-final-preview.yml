name: Phase 2 final mobile preview
on:
  push:
    branches:
      - fix/phase-2-mobile-consistency
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-2-mobile-consistency
      - name: Wait for latest Netlify preview
        run: |
          URL="https://deploy-preview-5--rigan.netlify.app"
          for i in $(seq 1 30); do
            html=$(curl -L -s "$URL/contact.html" || true)
            css=$(curl -L -s "$URL/mobile-consistency.css" || true)
            if echo "$html" | grep -q 'event.composedPath().includes(menuToggle)' && echo "$css" | grep -q 'display: none !important'; then
              exit 0
            fi
            sleep 4
          done
          exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Run final preview checks
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://deploy-preview-5--rigan.netlify.app';
            const pages=[['index.html','Home'],['experience-v2.html','Experiences'],['experience-detail-v2.html?experience=annapurna-base-camp-trek','Experience detail'],['regions.html','Regions'],['about.html','About'],['plan.html','Plan'],['contact.html','Contact'],['work-with-us.html','Work With Us']];
            const browser=await chromium.launch({headless:true});
            const fail=[]; const pass=[];
            for(const vp of [{width:390,height:844,label:'390px'},{width:768,height:1024,label:'768px'}]){
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              for(const [path,name] of pages){
                const p=await ctx.newPage(); const js=[]; p.on('pageerror',e=>js.push(e.message));
                try{
                  const r=await p.goto(`${base}/${path}`,{waitUntil:'networkidle',timeout:45000});
                  if(!r||r.status()>=400){fail.push(`${name} ${vp.label} HTTP ${r?r.status():'none'}`);await p.close();continue}
                  const m=await p.evaluate(()=>({vw:innerWidth,docW:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth),small:[...document.querySelectorAll('input,select,textarea')].filter(el=>el.offsetParent!==null&&parseFloat(getComputedStyle(el).fontSize)<16).length}));
                  if(m.docW>m.vw+3) fail.push(`${name} ${vp.label} overflow ${m.docW}/${m.vw}`); else pass.push(`${name} ${vp.label} width`);
                  if(m.small) fail.push(`${name} ${vp.label} small form text`); else pass.push(`${name} ${vp.label} form text`);
                  if(js.length) fail.push(`${name} ${vp.label} JS ${js.join('|')}`); else pass.push(`${name} ${vp.label} JS`);
                }catch(e){fail.push(`${name} ${vp.label} ${e.message}`)}
                await p.close();
              }
              await ctx.close();
            }
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            for(const [path,b,n,c,name] of [['regions.html','#mobileMenuBtn','#navLinks','active','Regions'],['plan.html','#menuBtn','#navLinks','active','Plan'],['about.html','#aboutMenuBtn','#aboutNavLinks','active','About'],['work-with-us.html','#hostMenuBtn','#hostNavLinks','active','Work With Us'],['contact.html','#menuToggle','#navLinks','open','Contact']]){
              const p=await ctx.newPage();await p.goto(`${base}/${path}`,{waitUntil:'networkidle',timeout:45000});
              const btn=p.locator(b);const box=await btn.boundingBox();if(!box||box.width<44||box.height<44)fail.push(`${name} menu target ${box?box.width+'x'+box.height:'hidden'}`);else pass.push(`${name} target`);
              await btn.click();await p.waitForTimeout(100);const state=await p.locator(n).evaluate((el,cl)=>({has:el.classList.contains(cl),display:getComputedStyle(el).display}),c);if(!state.has||state.display==='none')fail.push(`${name} menu ${JSON.stringify(state)}`);else pass.push(`${name} menu`);await p.close();
            }
            const home=await ctx.newPage();await home.goto(`${base}/index.html`,{waitUntil:'networkidle',timeout:45000});const bad=await home.locator('.trip-book,.trip-link').evaluateAll(es=>es.filter(e=>e.getBoundingClientRect().height<44).length);if(bad)fail.push(`Home trip targets ${bad}`);else pass.push('Home trip targets');await home.close();await ctx.close();
            await browser.close();
            console.log('PASS COUNT='+pass.length);if(fail.length){console.error('FAILURES:\n'+fail.join('\n'));process.exit(1)}console.log('ALL FINAL PHASE 2 TESTS PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove temporary final preview workflow
        if: always()
        run: |
          rm -f .github/workflows/phase2-final-preview.yml
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase2-final-preview.yml
          git commit -m 'Remove temporary Phase 2 final preview workflow'
          git push origin HEAD:fix/phase-2-mobile-consistency
