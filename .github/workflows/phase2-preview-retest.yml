name: Phase 2 mobile preview retest
on:
  push:
    branches: [fix/phase-2-mobile-consistency]
permissions:
  contents: write
jobs:
  retest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-2-mobile-consistency
      - name: Wait for latest preview
        run: |
          URL="https://deploy-preview-5--rigan.netlify.app"
          for i in $(seq 1 30); do
            css=$(curl -L -s "$URL/mobile-consistency.css" || true)
            if echo "$css" | grep -q "display: none !important"; then
              echo "Latest preview is ready"
              exit 0
            fi
            echo "Waiting for updated preview ($i)"
            sleep 4
          done
          exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Retest critical mobile behavior
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const base='https://deploy-preview-5--rigan.netlify.app';
            const browser=await chromium.launch({headless:true});
            const fails=[];
            const passes=[];
            const pass=m=>passes.push('PASS: '+m);
            const fail=(m,d='')=>fails.push('FAIL: '+m+(d?' — '+d:''));
            for (const vp of [{width:390,height:844,label:'390px'},{width:768,height:1024,label:'768px'}]) {
              const ctx=await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              for (const [path,name] of [['regions.html','Regions'],['plan.html','Plan']]) {
                const p=await ctx.newPage();
                await p.goto(`${base}/${path}`,{waitUntil:'networkidle',timeout:45000});
                const m=await p.evaluate(()=>({vw:innerWidth,docW:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)}));
                m.docW<=m.vw+3?pass(`${name} ${vp.label} no horizontal overflow`):fail(`${name} ${vp.label} overflow`,`${m.docW}/${m.vw}`);
                await p.close();
              }
              await ctx.close();
            }
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            for (const [path,btnSel,navSel,cls,name] of [
              ['regions.html','#mobileMenuBtn','#navLinks','active','Regions'],
              ['plan.html','#menuBtn','#navLinks','active','Plan'],
              ['contact.html','#menuToggle','#navLinks','open','Contact']
            ]) {
              const p=await ctx.newPage();
              await p.goto(`${base}/${path}`,{waitUntil:'networkidle',timeout:45000});
              await p.locator(btnSel).click();
              await p.waitForTimeout(100);
              const state=await p.locator(navSel).evaluate((el,c)=>({has:el.classList.contains(c),display:getComputedStyle(el).display}),cls);
              state.has && state.display!=='none'?pass(`${name} mobile menu opens`):fail(`${name} mobile menu opens`,JSON.stringify(state));
              await p.close();
            }
            await ctx.close();
            await browser.close();
            console.log(passes.join('\n'));
            if(fails.length){console.error('\nFAILURES:\n'+fails.join('\n'));process.exit(1)}
            console.log('\nCRITICAL PHASE 2 RETEST PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove temporary retest workflow
        if: always()
        run: |
          rm -f .github/workflows/phase2-preview-retest.yml
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase2-preview-retest.yml
          git commit -m 'Remove temporary Phase 2 retest workflow'
          git push origin HEAD:fix/phase-2-mobile-consistency
