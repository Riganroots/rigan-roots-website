name: Phase 2 mobile preview test
on:
  push:
    branches: [fix/phase-2-mobile-consistency]
permissions:
  contents: write
jobs:
  preview-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase-2-mobile-consistency
      - name: Wait for Netlify preview
        run: |
          URL="https://deploy-preview-5--rigan.netlify.app"
          for i in $(seq 1 24); do
            code=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Preview attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Preview did not become ready in time"
          exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Test responsive layouts and mobile interactions
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const base = 'https://deploy-preview-5--rigan.netlify.app';
            const pages = [
              ['index.html','Home'],
              ['experience-v2.html','Experiences'],
              ['experience-detail-v2.html?experience=annapurna-base-camp-trek','Experience detail'],
              ['regions.html','Regions'],
              ['about.html','About'],
              ['plan.html','Plan'],
              ['contact.html','Contact'],
              ['work-with-us.html','Work With Us']
            ];
            const browser = await chromium.launch({headless:true});
            const failures = [];
            const passes = [];
            const pass = m => passes.push('PASS: ' + m);
            const fail = (m,d='') => failures.push('FAIL: ' + m + (d ? ' — ' + d : ''));

            for (const viewport of [{width:390,height:844,label:'390px'},{width:768,height:1024,label:'768px'}]) {
              const context = await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});
              for (const [path,name] of pages) {
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                try {
                  const r = await page.goto(`${base}/${path}`, {waitUntil:'networkidle', timeout:45000});
                  if (!r || r.status() >= 400) { fail(`${name} ${viewport.label} loads`, `HTTP ${r ? r.status() : 'none'}`); await page.close(); continue; }
                  const metrics = await page.evaluate(() => ({
                    vw: innerWidth,
                    docW: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth),
                    smallInputs: [...document.querySelectorAll('input,select,textarea')].filter(el => el.offsetParent !== null && parseFloat(getComputedStyle(el).fontSize) < 16).map(el => `${el.tagName}#${el.id}:${getComputedStyle(el).fontSize}`),
                  }));
                  metrics.docW <= metrics.vw + 3 ? pass(`${name} ${viewport.label} has no horizontal overflow`) : fail(`${name} ${viewport.label} horizontal overflow`, `${metrics.docW}/${metrics.vw}`);
                  metrics.smallInputs.length === 0 ? pass(`${name} ${viewport.label} mobile form text is 16px+`) : fail(`${name} ${viewport.label} small form text`, metrics.smallInputs.join(', '));
                  if (errors.length) fail(`${name} ${viewport.label} no uncaught JS errors`, errors.join(' | ')); else pass(`${name} ${viewport.label} no uncaught JS errors`);
                } catch (e) { fail(`${name} ${viewport.label} loads`, e.message); }
                await page.close();
              }
              await context.close();
            }

            const context = await browser.newContext({viewport:{width:390,height:844}});
            async function checkMenu(path, buttonSelector, navSelector, activeClass, label) {
              const page = await context.newPage();
              await page.goto(`${base}/${path}`, {waitUntil:'networkidle', timeout:45000});
              const btn = page.locator(buttonSelector);
              if (!(await btn.count())) { fail(`${label} menu button exists`); await page.close(); return; }
              const box = await btn.boundingBox();
              if (box && box.width >= 44 && box.height >= 44) pass(`${label} menu button is 44px touch target`); else fail(`${label} menu button touch target`, box ? `${Math.round(box.width)}x${Math.round(box.height)}` : 'not visible');
              await btn.click();
              const open = await page.locator(navSelector).evaluate((el, cls) => el.classList.contains(cls), activeClass);
              open ? pass(`${label} menu opens`) : fail(`${label} menu opens`);
              await page.close();
            }
            await checkMenu('regions.html','#mobileMenuBtn','#navLinks','active','Regions');
            await checkMenu('plan.html','#menuBtn','#navLinks','active','Plan');
            await checkMenu('about.html','#aboutMenuBtn','#aboutNavLinks','active','About');
            await checkMenu('work-with-us.html','#hostMenuBtn','#hostNavLinks','active','Work With Us');
            await checkMenu('contact.html','#menuToggle','#navLinks','open','Contact');

            const home = await context.newPage();
            await home.goto(`${base}/index.html`, {waitUntil:'networkidle', timeout:45000});
            const tripTargets = await home.locator('.trip-book,.trip-link').evaluateAll(els => els.map(el => ({text:el.textContent.trim(),w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height})));
            const badTrips = tripTargets.filter(x => x.h < 44);
            badTrips.length ? fail('Home trip actions are 44px touch targets', JSON.stringify(badTrips)) : pass('Home trip actions are 44px touch targets');
            await home.close();
            await context.close();

            await browser.close();
            console.log(passes.join('\n'));
            if (failures.length) {
              console.error('\nFAILURES:\n' + failures.join('\n'));
              process.exit(1);
            }
            console.log('\nALL PHASE 2 PREVIEW TESTS PASSED');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Remove temporary preview workflow
        if: always()
        run: |
          rm -f .github/workflows/phase2-preview-test.yml
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase2-preview-test.yml
          git commit -m 'Remove temporary Phase 2 preview workflow'
          git push origin HEAD:fix/phase-2-mobile-consistency
