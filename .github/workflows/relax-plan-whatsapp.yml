name: Reduce Plan WhatsApp enquiry friction
on:
  push:
    branches: [feature/phase-3-quote-conversion]
    paths: [.github/workflows/relax-plan-whatsapp.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-3-quote-conversion
      - name: Allow quick WhatsApp quote requests
        shell: python
        run: |
          from pathlib import Path
          p=Path('plan.html')
          s=p.read_text()
          old="function wa(){if(!form.checkValidity()){form.reportValidity();return}const e=getExp(),r=getRegion(),msg=encodeURIComponent(`Hello Rigan Roots & Routes,\\n\\nName: ${$('name').value}\\nEmail: ${$('email').value}\\nPhone: ${$('phone').value}\\nCountry: ${$('country').value||'Not provided'}\\nPreferred Region: ${r?r[0]:'Not selected'}\\nExperience: ${e[0]}\\nTravel Date: ${$('date').value||'Flexible'}\\nDuration: ${duration.value==='custom'?'Custom':duration.value+' days'}\\nGroup Size: ${text(group)}\\nTravel Style: ${text(style)}\\nBudget: ${$('budget').value||'Not selected'}\\nPrice / Quote Status: ${$('estimatedPrice').textContent}\\n\\nMessage: ${$('message').value||'No additional message'}`);window.open('https://wa.me/9779843322695?text='+msg,'_blank')}"
          new="function wa(){const e=getExp(),r=getRegion(),durationText=!duration.value?'Not selected':duration.value==='custom'?'Custom':duration.value+' days',msg=encodeURIComponent(`Hello Rigan Roots & Routes,\\n\\nName: ${$('name').value||'Not provided'}\\nEmail: ${$('email').value||'Not provided'}\\nPhone: ${$('phone').value||'Not provided'}\\nCountry: ${$('country').value||'Not provided'}\\nPreferred Region: ${r?r[0]:'Not selected'}\\nExperience: ${e[0]}\\nTravel Date: ${$('date').value||'Flexible'}\\nDuration: ${durationText}\\nGroup Size: ${text(group)||'Not selected'}\\nTravel Style: ${text(style)||'Not selected'}\\nBudget: ${$('budget').value||'Not selected'}\\nPrice / Quote Status: ${$('estimatedPrice').textContent}\\n\\nMessage: ${$('message').value||'No additional message'}\\n\\nPlease send me the detailed quotation and next steps.`);window.open('https://wa.me/9779843322695?text='+msg,'_blank')}"
          assert old in s, 'Expected Plan WhatsApp function not found'
          p.write_text(s.replace(old,new,1))
      - name: Commit and clean up workflow
        run: |
          rm -f .github/workflows/relax-plan-whatsapp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plan.html .github/workflows/relax-plan-whatsapp.yml
          git commit -m 'Reduce WhatsApp enquiry friction'
          git push origin HEAD:feature/phase-3-quote-conversion
