name: Run Regions identity update

on:
  push:
    branches:
      - design/regions-nepal-identity
    paths:
      - '.github/workflows/run-regions-identity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/regions-nepal-identity
      - name: Apply update
        run: python tools/apply_regions_identity.py
      - name: Validate update
        run: |
          grep -q 'class="prayer-flags"' regions/index.html
          grep -q 'class="nepal-map-watermark"' regions/index.html
          grep -q 'const regionCategoryImages' regions/index.html
          grep -q 'function updateMandalaVisual()' regions/index.html
          grep -q 'fa-paw' regions/index.html
          if grep -q 'mandala-icon">⭐' regions/index.html; then exit 1; fi
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add regions/index.html
          git commit -m 'Add Nepal visual identity to Regions selector and cards'
          git push
