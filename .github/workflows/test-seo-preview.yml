name: Test SEO foundation preview
on:
  push:
    branches:
      - feature/phase-4-seo-foundation
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase-4-seo-foundation
      - name: Wait for Netlify preview
        shell: bash
        run: |
          URL="https://deploy-preview-10--rigan.netlify.app"
          for i in $(seq 1 35); do
            body=$(curl -L -s "$URL/index.html" || true)
            sitemap=$(curl -L -s "$URL/sitemap.xml" || true)
            if echo "$body" | grep -q 'organizationSchema' && echo "$sitemap" | grep -q 'everest-base-camp-trek'; then
              exit 0
            fi
            sleep 4
          done
          echo "Preview did not update in time"
          exit 1
      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Validate SEO and package metadata
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://deploy-preview-10--rigan.netlify.app';
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844}});
            let passes=0;
            const check=(cond,msg)=>{if(!cond) throw new Error(msg); passes++;};

            async function open(path){
              const page=await ctx.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const res=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:30000});
              check(res && res.status()<400, path+' HTTP status');
              await page.waitForTimeout(600);
              return {page,errors};
            }

            const staticPages=[
              ['/', 'https://riganrootsroutes.com/'],
              ['/experience-v2.html','https://riganrootsroutes.com/experience-v2.html'],
              ['/regions.html','https://riganrootsroutes.com/regions.html'],
              ['/about.html','https://riganrootsroutes.com/about.html'],
              ['/plan.html','https://riganrootsroutes.com/plan.html'],
              ['/contact.html','https://riganrootsroutes.com/contact.html'],
              ['/work-with-us.html','https://riganrootsroutes.com/work-with-us.html']
            ];

            for(const [path,canonical] of staticPages){
              const {page,errors}=await open(path);
              check((await page.locator('link[rel="canonical"]').getAttribute('href'))===canonical,path+' canonical');
              check((await page.locator('meta[name="description"]').getAttribute('content')||'').length>50,path+' description');
              check((await page.locator('meta[property="og:title"]').getAttribute('content')||'').length>10,path+' OG title');
              check((await page.locator('meta[name="twitter:card"]').getAttribute('content'))==='summary_large_image',path+' Twitter card');
              check(errors.length===0,path+' JS errors: '+errors.join('|'));
              await page.close();
            }

            {
              const {page,errors}=await open('/');
              const org=JSON.parse(await page.locator('#organizationSchema').textContent());
              check(org['@type']==='TravelAgency','home TravelAgency schema');
              check(org.url==='https://riganrootsroutes.com/','home schema URL');
              await page.close();
            }

            for(const slug of ['everest-base-camp-trek','mardi-himal-trek','shey-phoksundo-trek']){
              const {page,errors}=await open('/experience-detail-v2.html?experience='+slug);
              const title=await page.title();
              check(!/Experience Detail/.test(title),slug+' dynamic title');
              const canonical=await page.locator('link[rel="canonical"]').getAttribute('href');
              check(canonical==='https://riganrootsroutes.com/experience-detail-v2.html?experience='+slug,slug+' canonical');
              check((await page.locator('meta[property="og:url"]').getAttribute('content'))===canonical,slug+' OG URL');
              check((await page.locator('meta[property="og:image"]').getAttribute('content')||'').startsWith('http'),slug+' OG image');
              const schema=JSON.parse(await page.locator('#experienceSchema').textContent());
              const graph=schema['@graph']||[];
              check(graph.some(x=>x['@type']==='TouristTrip'),slug+' TouristTrip schema');
              check(graph.some(x=>x['@type']==='BreadcrumbList'),slug+' breadcrumb schema');
              const dims=await page.evaluate(()=>({vw:innerWidth,dw:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)}));
              check(dims.dw<=dims.vw+3,slug+' mobile overflow '+dims.dw+'/'+dims.vw);
              check(errors.length===0,slug+' JS errors: '+errors.join('|'));
              await page.close();
            }

            const robots=await (await fetch(base+'/robots.txt')).text();
            check(robots.includes('Sitemap: https://riganrootsroutes.com/sitemap.xml'),'robots sitemap');
            const sitemap=await (await fetch(base+'/sitemap.xml')).text();
            check((sitemap.match(/<loc>/g)||[]).length===37,'sitemap URL count');
            check(sitemap.includes('shey-phoksundo-trek'),'sitemap package URL');

            await browser.close();
            console.log('SEO PREVIEW TESTS PASSED:',passes);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove temporary preview test
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/test-seo-preview.yml
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/test-seo-preview.yml
          git commit -m 'Remove temporary SEO preview test'
          git push origin HEAD:feature/phase-4-seo-foundation
