name: Update Our Story copy

on:
  push:
    branches:
      - feature/update-rigan-family-story
    paths:
      - '.github/workflows/update-about-story.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/update-rigan-family-story

      - name: Replace Our Story section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('about/index.html')
          text = path.read_text(encoding='utf-8')
          old = '''    <div>\n      <h2>Our Story</h2>\n      <p>Rigan Roots & Routes was created to give travelers a deeper connection with Nepal — beyond mountains, into culture, people, and real life.</p>\n      <p>From village mornings to festivals, from food to hidden trails, we design experiences that feel personal and meaningful.</p>\n    </div>'''
          new = '''    <div class="story-copy">\n      <h2>Our Story</h2>\n      <p><strong>Rigan began with family.</strong></p>\n      <p>The name Rigan carries a very personal meaning for us. <strong>“Ri” comes from Rita, our mother, and “Gan” comes from Ganesh, our father.</strong> Together, their names became Rigan — a name that represents the roots, values, love, and guidance that shaped our journey.</p>\n      <p>That meaning naturally became the heart of <strong>Rigan Roots & Routes.</strong></p>\n      <p><strong>Roots</strong> represent where we come from — Nepal, our culture, traditions, communities, family, and heritage.</p>\n      <p><strong>Routes</strong> represent the journeys we create — connecting travelers with Nepal through its people, landscapes, food, festivals, stories, and everyday life.</p>\n      <p>Rigan Roots & Routes was created with a simple belief: <strong>travel should be more than visiting places. It should create connection.</strong></p>\n      <p>We want our guests to go beyond the usual tourist experience — to meet local people, understand traditions, taste Nepal, share stories, and experience the country in a more personal and meaningful way.</p>\n      <p>What started with the names of our parents has grown into a vision: to share the Nepal we know, love, and call home with travelers from around the world.</p>\n      <p class="story-signoff"><strong>Rigan — rooted in family, created for meaningful journeys.</strong></p>\n    </div>'''
          if old not in text:
              raise SystemExit('Existing Our Story block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '<meta property="og:description" content="Learn about Rigan Roots &amp; Routes and our approach to meaningful Nepal travel through local people, culture, communities and authentic experiences.">',
              '<meta property="og:description" content="Discover how Rigan began with family — a name inspired by Rita and Ganesh — and grew into meaningful Nepal journeys rooted in people, culture and connection.">',
              1
          )
          text = text.replace(
              '<meta name="twitter:description" content="Learn about Rigan Roots &amp; Routes and our approach to meaningful Nepal travel through local people, culture, communities and authentic experiences.">',
              '<meta name="twitter:description" content="Discover how Rigan began with family — a name inspired by Rita and Ganesh — and grew into meaningful Nepal journeys rooted in people, culture and connection.">',
              1
          )
          text = text.replace(
              '<meta name="description" content="Learn about Rigan Roots &amp; Routes and our approach to meaningful Nepal travel through local people, culture, communities and authentic experiences.">',
              '<meta name="description" content="Discover how Rigan began with family — a name inspired by Rita and Ganesh — and grew into meaningful Nepal journeys rooted in people, culture and connection.">',
              1
          )

          style_anchor = '''.grid img{\n  width:100%;\n  border-radius:20px;\n}\n'''
          style_add = '''.grid img{\n  width:100%;\n  border-radius:20px;\n}\n\n.story-copy p{\n  margin-top:16px;\n}\n\n.story-copy p:first-of-type{\n  margin-top:12px;\n  font-size:1.15rem;\n  color:#174d2f;\n}\n\n.story-signoff{\n  padding-top:8px;\n  color:#174d2f;\n  font-family:"Playfair Display",serif;\n  font-size:1.1rem;\n}\n'''
          if style_anchor not in text:
              raise SystemExit('Story style anchor not found')
          text = text.replace(style_anchor, style_add, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('about/index.html').read_text(encoding='utf-8')
          required = [
              'Rigan began with family.',
              '“Ri” comes from Rita, our mother, and “Gan” comes from Ganesh, our father.',
              'Roots</strong> represent where we come from',
              'Routes</strong> represent the journeys we create',
              'Rigan — rooted in family, created for meaningful journeys.'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing story copy: {missing}')
          print('Our Story copy validated.')
          PY

      - name: Commit update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about/index.html
          git commit -m 'Update Our Story with Rigan family origin'
          git push
