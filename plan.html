<style>
:root{--green:#174d2f;--dark:#071611;--olive:#9fba6b;--cream:#f7f0e4;--gold:#e6c36a;--text:#132018;--muted:#66746b;--shadow:0 24px 70px rgba(19,32,24,.13)}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Inter,sans-serif;color:var(--text);line-height:1.65;overflow-x:hidden;background:radial-gradient(circle at 12% 8%,rgba(159,186,107,.35),transparent 30%),radial-gradient(circle at 92% 16%,rgba(164,106,63,.22),transparent 28%),var(--cream)}body.menu-open{overflow:hidden}h1,h2,h3{font-family:"Playfair Display",serif;color:#0f3522}a{text-decoration:none}.container{max-width:1200px;margin:auto;padding:0 24px}
.navbar{position:sticky;top:16px;z-index:1000;width:min(1180px,calc(100% - 36px));margin:16px auto 0;border:1px solid rgba(23,77,47,.1);border-radius:999px;background:rgba(255,255,255,.85);backdrop-filter:blur(18px);box-shadow:0 16px 45px rgba(19,32,24,.08)}.nav-container{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 13px 20px}.brand{display:flex;align-items:center;gap:12px;color:#0f3522;font-weight:900}.brand-logo{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--olive),var(--gold))}.brand-name{font-size:15px}.brand-tagline{font-size:11px;color:#64748b}.nav-links{display:flex;gap:18px;align-items:center}.nav-links a{color:#475467;font-size:13px;font-weight:800}.nav-links a.active,.nav-links a:hover{color:var(--green)}.nav-cta{padding:11px 16px;border-radius:999px;background:var(--green);color:#fff!important}.mobile-menu-btn{display:none;border:0;background:none;font-size:24px;color:var(--green)}
.hero{text-align:center;padding:90px 0 35px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:1;max-width:900px;margin:0 auto 18px}.hero p{max-width:760px;margin:auto;color:#53645a;font-size:18px}.section-label{display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border-radius:999px;background:rgba(23,77,47,.08);color:var(--green);font-size:12px;font-weight:900;margin-bottom:18px}
.mandala{position:relative;height:500px;max-width:900px;margin:20px auto 45px;border-radius:38px;overflow:hidden;background:linear-gradient(rgba(247,240,228,.84),rgba(247,240,228,.92)),url('https://i.postimg.cc/9M6dDyqv/live-like-nepali-jpg.jpg') center/cover;box-shadow:var(--shadow)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:210px;height:210px;border-radius:50%;background:linear-gradient(135deg,var(--green),#2f6b3f);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center}.center h2{color:#fff;font-size:42px}.mood{position:absolute;width:135px;height:135px;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:var(--green);font-weight:900;cursor:pointer;box-shadow:0 18px 45px rgba(0,0,0,.1)}.mood.active{background:var(--olive);color:#fff}.mood small{display:block;font-size:24px}.m1{left:50%;top:0;transform:translateX(-50%)}.m2{right:90px;top:80px}.m3{right:90px;bottom:80px}.m4{left:50%;bottom:-15px;transform:translateX(-50%)}.m5{left:90px;bottom:80px}.m6{left:90px;top:80px}
.selected{max-width:1000px;margin:0 auto 28px;padding:18px 24px;border-radius:22px;background:#fff;box-shadow:0 16px 45px rgba(19,32,24,.08);display:grid;gap:7px}.selected span{color:var(--green);font-weight:900}#regionRow{display:none}
.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start}.form-box,.preview,.info{background:rgba(255,255,255,.95);border:1px solid rgba(23,77,47,.08);border-radius:32px;box-shadow:0 18px 45px rgba(19,32,24,.09)}.form-box{padding:30px}.form-box h2{font-size:34px}.form-box>p{color:var(--muted);margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}input,select,textarea{width:100%;padding:15px;border:1px solid rgba(23,77,47,.15);border-radius:15px;background:#fff;font:inherit;outline:none}textarea{grid-column:span 2;min-height:120px}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.buttons button{padding:15px 24px;border:0;border-radius:999px;font-weight:900;cursor:pointer}.submit{background:var(--green);color:#fff}.wa{background:#25d366;color:#fff}.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.preview{position:sticky;top:105px;overflow:hidden}.preview-img-wrap{height:260px;position:relative}.preview-img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;left:18px;bottom:18px;background:#fff;color:var(--green);padding:8px 13px;border-radius:999px;font-size:12px;font-weight:900}.preview-body{padding:24px}.preview-body h2{font-size:30px}.preview-body>p{color:var(--muted)}.meta{display:grid;gap:9px;margin:17px 0}.meta div{background:#edf5eb;border-radius:14px;padding:11px 13px}.price{padding:17px;border-radius:20px;background:linear-gradient(135deg,#fff,#fff8e9,#edf5eb)}.price span{display:block;color:var(--green);font-size:32px;font-weight:900}.itinerary{margin-top:18px}.day{border-left:3px solid var(--olive);padding-left:13px;margin-bottom:10px}.day strong{color:var(--green)}#previewRegionBox{display:none}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:45px 0}.info{padding:22px}.info p{color:var(--muted)}.footer{background:var(--dark);color:#fff;padding:55px 0 28px;margin-top:45px}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:35px}.footer a,.footer p{color:rgba(255,255,255,.75);font-size:14px}.floating{position:fixed;right:20px;bottom:20px;z-index:1100}.floating a{display:flex;gap:8px;align-items:center;background:#25d366;color:#fff;padding:13px 20px;border-radius:999px;font-weight:900}
@media(max-width:950px){.layout,.info-grid,.footer-grid{grid-template-columns:1fr}.preview{position:static}}@media(max-width:800px){.mobile-menu-btn{display:block}.nav-links{position:fixed;top:0;right:-100%;height:100vh;width:78%;background:#fff;flex-direction:column;justify-content:center;transition:.3s}.nav-links.active{right:0}.mandala{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px}.center{display:none}.mood{position:static;width:100%;height:95px;border-radius:22px;transform:none!important}}@media(max-width:600px){.brand-tagline{display:none}.container{padding:0 16px}.hero{padding:65px 0 25px}.hero h1{font-size:42px}.grid{grid-template-columns:1fr}textarea{grid-column:span 1}.buttons button{width:100%}.floating a span{display:none}.floating a{width:56px;height:56px;justify-content:center;padding:0;border-radius:50%}}
