<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <title>Work With Us | Rigan Roots &amp; Routes</title>
<!-- SEO FOUNDATION START -->
<link rel="canonical" href="https://riganrootsroutes.com/work-with-us.html">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta property="og:type" content="website">

<meta property="og:title" content="Work With Us | Rigan Roots &amp; Routes">
<meta property="og:description" content="Work with Rigan Roots &amp; Routes as a local host, guide or community partner and help travellers experience Nepal through local people and culture.">

<meta name="twitter:title" content="Work With Us | Rigan Roots &amp; Routes">
<meta name="twitter:description" content="Work with Rigan Roots &amp; Routes as a local host, guide or community partner and help travellers experience Nepal through local people and culture.">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --green:#174d2f;
      --green2:#2f6b3f;
      --brown:#9b6238;
      --cream:#f7f0e4;
      --light:#fffaf2;
      --dark:#101815;
      --text:#26352b;
      --muted:#6b746d;
      --border:rgba(23,77,47,.15);
      --shadow:0 22px 55px rgba(16,24,21,.12);
      --radius:28px;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      font-family:Inter,sans-serif;
      background:var(--cream);
      color:var(--text);
      line-height:1.7;
    }

    a{text-decoration:none;color:inherit}

    .container{
      width:min(1180px,92%);
      margin:auto;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:15px 28px;
      border-radius:999px;
      font-weight:800;
      transition:.3s ease;
    }

    .btn-primary{
      background:var(--green);
      color:#fff;
      box-shadow:0 15px 35px rgba(23,77,47,.28);
    }

    .btn-primary:hover{
      background:#103721;
      transform:translateY(-3px);
    }

    .btn-white{
      background:rgba(255,255,255,.18);
      color:#fff;
      border:1px solid rgba(255,255,255,.42);
      backdrop-filter:blur(8px);
    }

    .section{padding:90px 0}

    .label{
      font-size:12px;
      font-weight:900;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--green2);
      margin-bottom:12px;
    }

    .title{
      font-family:"Playfair Display",serif;
      font-size:clamp(34px,5vw,58px);
      line-height:1.08;
      color:var(--dark);
      margin-bottom:18px;
    }

    .text{
      max-width:680px;
      color:var(--muted);
      font-size:17px;
    }

    .nav{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      z-index:10;
      padding:26px 0;
      color:#fff;
    }

    .nav-inner{
      width:min(1180px,92%);
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
    }

    .logo{
      font-weight:900;
      letter-spacing:3px;
      font-size:18px;
    }

    .mobile-menu-btn{display:none;border:0;background:transparent;color:#fff;font-size:25px;cursor:pointer}

    .nav-links{
      display:flex;
      gap:24px;
      font-size:14px;
      font-weight:700;
    }

    .hero{
      min-height:94vh;
      display:flex;
      align-items:center;
      color:#fff;
      background:
        linear-gradient(90deg,rgba(10,24,16,.86),rgba(10,24,16,.42)),
        url("https://i.postimg.cc/sXQPfT1b/village-immersion-jpg.jpg") center/cover no-repeat;
      position:relative;
    }

    .hero-content{
      width:min(1180px,92%);
      margin:auto;
      padding-top:70px;
    }

    .hero-badge{
      display:inline-block;
      padding:9px 16px;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.28);
      font-size:13px;
      font-weight:800;
      margin-bottom:22px;
      backdrop-filter:blur(8px);
    }

    .hero h1{
      font-family:"Playfair Display",serif;
      font-size:clamp(48px,7vw,88px);
      line-height:.98;
      max-width:820px;
      margin-bottom:26px;
    }

    .hero p{
      max-width:650px;
      font-size:19px;
      color:rgba(255,255,255,.86);
      margin-bottom:34px;
    }

    .hero-actions{
      display:flex;
      gap:15px;
      flex-wrap:wrap;
    }

    .hero-stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
      max-width:720px;
      margin-top:52px;
    }

    .stat{
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.24);
      border-radius:22px;
      padding:20px;
      backdrop-filter:blur(10px);
    }

    .stat strong{
      display:block;
      font-size:26px;
      margin-bottom:4px;
    }

    .stat span{
      color:rgba(255,255,255,.76);
      font-size:13px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:22px;
      margin-top:45px;
    }

    .card{
      background:var(--light);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:30px;
      box-shadow:var(--shadow);
      transition:.3s ease;
    }

    .card:hover{transform:translateY(-8px)}

    .icon{
      width:58px;
      height:58px;
      border-radius:50%;
      background:rgba(23,77,47,.1);
      display:grid;
      place-items:center;
      font-size:26px;
      margin-bottom:22px;
    }

    .card h3{
      color:var(--dark);
      font-size:21px;
      margin-bottom:10px;
    }

    .card p{
      color:var(--muted);
      font-size:15px;
    }

    .dark-section{
      background:var(--dark);
      color:#fff;
    }

    .dark-section .title{color:#fff}
    .dark-section .text{color:rgba(255,255,255,.68)}
    .dark-section .label{color:#b8d58a}

    .why-grid{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:18px;
      margin-top:45px;
    }

    .why-box{
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      padding:26px;
    }

    .why-box h3{
      font-size:18px;
      margin-bottom:10px;
    }

    .why-box p{
      color:rgba(255,255,255,.68);
      font-size:14px;
    }

    .offer-grid{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:32px;
      align-items:center;
      margin-top:45px;
    }

    .offer-image{
      height:520px;
      border-radius:34px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .offer-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .offer-list{
      display:grid;
      gap:14px;
    }

    .offer-item{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      padding:18px 22px;
      font-weight:700;
      color:var(--dark);
    }

    .offer-item span{margin-right:10px}

    .steps{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:18px;
      margin-top:50px;
      counter-reset:step;
    }

    .step{
      background:#fff;
      border:1px solid var(--border);
      border-radius:26px;
      padding:30px 24px;
      position:relative;
    }

    .step::before{
      counter-increment:step;
      content:counter(step);
      width:42px;
      height:42px;
      border-radius:50%;
      background:var(--green);
      color:#fff;
      display:grid;
      place-items:center;
      font-weight:900;
      margin-bottom:22px;
    }

    .step h3{
      color:var(--dark);
      margin-bottom:8px;
      font-size:19px;
    }

    .step p{
      color:var(--muted);
      font-size:14px;
    }

    .split{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:30px;
      margin-top:45px;
    }

    .split-box{
      background:var(--light);
      border:1px solid var(--border);
      border-radius:32px;
      padding:40px;
      box-shadow:var(--shadow);
    }

    .split-box h3{
      font-size:28px;
      color:var(--dark);
      margin-bottom:20px;
    }

    .split-box ul{
      list-style:none;
      display:grid;
      gap:14px;
    }

    .split-box li::before{
      content:"✓";
      color:var(--green2);
      font-weight:900;
      margin-right:10px;
    }

    .profile-preview{
      background:#fff;
      border-radius:36px;
      overflow:hidden;
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
      margin-top:45px;
    }

    .profile-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
      min-height:420px;
    }

    .profile-content{padding:48px}

    .host-tag{
      display:inline-block;
      background:rgba(23,77,47,.1);
      color:var(--green);
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      margin-bottom:18px;
    }

    .profile-content h3{
      font-family:"Playfair Display",serif;
      font-size:40px;
      line-height:1.1;
      margin-bottom:16px;
      color:var(--dark);
    }

    .profile-content p{
      color:var(--muted);
      margin-bottom:22px;
    }

    .mini-details{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      margin-top:25px;
    }

    .mini-details div{
      background:var(--cream);
      padding:15px;
      border-radius:16px;
      font-size:14px;
      font-weight:700;
    }

    .faq{
      display:grid;
      gap:16px;
      margin-top:40px;
    }

    details{
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      padding:22px 26px;
    }

    summary{
      cursor:pointer;
      font-weight:900;
      color:var(--dark);
    }

    details p{
      margin-top:12px;
      color:var(--muted);
    }

    /* FORM SECTION */
    .host-application-section{
      padding:95px 0;
      background:
        radial-gradient(circle at 12% 10%,rgba(159,186,107,.18),transparent 26%),
        linear-gradient(135deg,#fffaf2,#f2eadc);
    }

    .application-heading{
      max-width:760px;
      margin-bottom:45px;
    }

    .application-layout{
      display:grid;
      grid-template-columns:.8fr 1.2fr;
      gap:30px;
      align-items:start;
    }

    .application-info{
      display:grid;
      gap:16px;
    }

    .application-info-card{
      display:grid;
      grid-template-columns:52px 1fr;
      gap:16px;
      padding:22px;
      border:1px solid var(--border);
      border-radius:22px;
      background:rgba(255,255,255,.78);
    }

    .application-info-card>span{
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--green);
      color:#fff;
      font-weight:900;
    }

    .application-info-card h3{
      margin-bottom:5px;
      color:var(--dark);
      font-size:18px;
    }

    .application-info-card p{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }

    .host-form-card{
      padding:32px;
      border:1px solid var(--border);
      border-radius:32px;
      background:#fff;
      box-shadow:var(--shadow);
    }

    .host-form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:16px;
    }

    .form-field{
      display:grid;
      gap:7px;
    }

    .form-field.full-width{
      grid-column:1/-1;
    }

    .form-field label{
      color:var(--dark);
      font-size:13px;
      font-weight:800;
    }

    .host-form-grid input,
    .host-form-grid select,
    .host-form-grid textarea{
      width:100%;
      padding:14px 15px;
      border:1px solid rgba(23,77,47,.14);
      border-radius:14px;
      background:#fff;
      color:var(--text);
      font:inherit;
      outline:none;
    }

    .host-form-grid textarea{
      min-height:120px;
      resize:vertical;
    }

    .host-form-grid input:focus,
    .host-form-grid select:focus,
    .host-form-grid textarea:focus{
      border-color:var(--green2);
      box-shadow:0 0 0 4px rgba(47,107,63,.13);
    }

    .consent-box{
      display:flex;
      align-items:flex-start;
      gap:11px;
      margin:22px 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.65;
    }

    .consent-box input{
      width:18px;
      height:18px;
      flex-shrink:0;
      margin-top:3px;
    }

    .host-submit-btn{
      width:100%;
      padding:16px 24px;
      border:0;
      border-radius:999px;
      background:var(--green);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 15px 35px rgba(23,77,47,.22);
      transition:.3s ease;
    }

    .host-submit-btn:hover{
      background:#103721;
      transform:translateY(-2px);
    }

    .host-form-note{
      margin-top:13px;
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
      text-align:center;
    }

    .host-divider{
      position:relative;
      margin:24px 0;
      text-align:center;
    }

    .host-divider::before{
      content:"";
      position:absolute;
      top:50%;
      left:0;
      width:100%;
      border-top:1px solid var(--border);
    }

    .host-divider span{
      position:relative;
      z-index:2;
      padding:0 12px;
      background:#fff;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      text-transform:uppercase;
    }

    .host-whatsapp-btn{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:15px 24px;
      border-radius:999px;
      background:#25d366;
      color:#fff;
      font-weight:900;
    }

    footer{
      background:#0b140e;
      color:rgba(255,255,255,.65);
      text-align:center;
      padding:38px 0;
      font-size:14px;
    }

    @media(max-width:1050px){
      .cards,.why-grid,.steps{grid-template-columns:repeat(2,1fr)}
      .offer-grid,.profile-preview,.split,.application-layout{grid-template-columns:1fr}
      .profile-preview img{min-height:320px}
    }

    @media(max-width:700px){
      .mobile-menu-btn{display:block}
      .nav-inner{position:relative}
      .nav-links{display:none;position:absolute;top:54px;left:0;right:0;flex-direction:column;gap:0;padding:14px 20px;background:rgba(10,24,16,.97);border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
      .nav-links.active{display:flex}
      .nav-links a{padding:11px 0}
      .hero{min-height:90vh}
      .hero-stats,.cards,.why-grid,.steps,.mini-details{grid-template-columns:1fr}
      .section{padding:70px 0}
      .offer-image{height:360px}
      .hero h1{font-size:46px}
      .host-form-card{padding:22px}
      .host-form-grid{grid-template-columns:1fr}
      .form-field.full-width{grid-column:auto}
    }
  </style>
<link rel="stylesheet" href="mobile-consistency.css">
<script src="analytics.js" defer></script>
</head>
